            }
          : {
              zh: `已花 $${spend.toFixed(0)} 仍 0 单（已超止损线），请立即关停低效素材！`,
              en: `Spent $${spend.toFixed(0)} with 0 sales (past stop-loss)—pause losing ads!`,
            };
    }

    const diagMap = {
      cpm: {
        pass: { zh: "曝光成本健康，受众宽度合适。", en: "Healthy auction cost and audience size." },
        warn: { zh: "曝光略贵，检查是否叠加过多窄兴趣词。", en: "Slightly high CPM; avoid narrow interest stacking." },
        fail: { zh: "CPM 过高 (>$38)！请改用 Broad 通投并优化视频前3秒。", en: "CPM too high (>$38)! Use Broad targeting & stronger hook." },
      }[cpmSt],
      hook_rate: {
        pass: { zh: "黄金前 3 秒抓人能力优秀！", en: "Strong 3-second thumbstop hook!" },
        warn: { zh: "前 3 秒吸引力中等，可测试大字痛点字幕开头。", en: "Moderate hook; test bolder visual/caption in first 3s." },
        fail: { zh: "前 3 秒严重划走 (<19%)！请直接换视频前 3 秒画面。", en: "Weak hook (<19%)! Swap the first 3 seconds immediately." },
      }[hookSt],
      ctr: {
        pass: { zh: "广告种草与点击引导非常有力。", en: "Strong ad desire and click-through intent." },
        warn: { zh: "点击率尚可，可在后半段强化卖点对比与 CTA。", en: "Acceptable CTR; strengthen benefit & CTA." },
        fail: { zh: "出站点击率过低 (<0.8%)！观众只看不点，需加明確利益点。", en: "Low CTR (<0.8%)! Viewers watch but don't click; add clear CTA." },
      }[ctrSt],
      cpc: {
        pass: { zh: "进店流量成本控制良好。", en: "Healthy visitor acquisition cost." },
        warn: { zh: "单次点击略贵，提升 CTR 可直接拉低 CPC。", en: "Slightly high CPC; boosting CTR lowers CPC." },
        fail: { zh: "点击成本过高 (>$2.60)！挤压后端转化容错空间。", en: "CPC too high (>$2.60)! Leaves little room for checkout." },
      }[cpcSt],
      atc_rate: {
        pass: { zh: "落地页首屏与价格锚点承接良好！", en: "Landing page above-the-fold converts clicks well!" },
        warn: { zh: "加购率偏弱 (3.2%–5%)，建议强化首屏评价与包邮提示。", en: "Below-target ATC%; highlight reviews & free shipping." },
        fail: { zh: "落地页严重漏水 (<3.2%)！客户进站不加购，请修落地页首屏，别错怪广告！", en: "Landing page leak (<3.2%)! Fix LP speed & offer—don't blame the ad!" },
      }[atcSt],
      cvr: {
        pass: { zh: "网站结账转化链路顺畅！", en: "Strong checkout conversion rate!" },
        warn: { zh: "转化率处于临界区，检查免邮门槛与快捷支付。", en: "Borderline CVR; check shipping threshold & express pay." },
        fail: { zh: "加购后未成交 (<1%)！请检查结账页是否弹出高额运费或报错。", en: "Low CVR (<1%)! Check for surprise shipping fees at checkout." },
      }[cvrSt],
      cpa: cpaDiag,
    };

    const fmtMap = {
      cpm: `$${cpm.toFixed(2)}`,
      hook_rate: `${(hook * 100).toFixed(1)}%`,
      ctr: `${(ctr * 100).toFixed(2)}%`,
      cpc: clicks > 0 ? `$${cpc.toFixed(2)}` : "—",
      atc_rate: `${(atcRate * 100).toFixed(1)}%`,
      cvr: `${(cvr * 100).toFixed(2)}%`,
      cpa: cpaFmt,
    };
    const stMap = {
      cpm: cpmSt,
      hook_rate: hookSt,
      ctr: ctrSt,
      cpc: cpcSt,
      atc_rate: atcSt,
      cvr: cvrSt,
      cpa: cpaSt,
    };

    for (const card of state.monitor.cards) {
      card.value_fmt = fmtMap[card.id];
      card.status = stMap[card.id];
      card.diagnosis = diagMap[card.id];
      if (card.id === "cpa") {
        card.benchmark = `≤ $${breakevenCpa.toFixed(2)}`;
      }
    }

    let passed = 0;
    for (const g of state.graduation.items) {
      if (g.checked) passed += 1;
    }
    state.graduation.passed_count = passed;
    state.graduation.progress_pct = Math.round((passed / state.graduation.total_count) * 100);
    state.graduation.ready_for_step2 = passed === state.graduation.total_count;
  }

  function bindEvents(container) {
    // Sub-step wizard navigation
    container.querySelectorAll("[data-cs-step], [data-cs-goto]").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeSubStep = btn.dataset.csStep || btn.dataset.csGoto;
        render(container);
      });
    });

    // Stage 1 Sliders
    const bindSlider = (sel, key) => {
      const el = container.querySelector(sel);
      if (!el) return;
      el.addEventListener("input", () => {
        state.calculator.inputs[key] = Number(el.value);
        recomputeState();
        render(container);
      });
    };
    bindSlider("#cs-sl-aov", "aov");
    bindSlider("#cs-sl-margin", "gross_margin_pct");
    bindSlider("#cs-sl-adsets", "test_adsets");
    bindSlider("#cs-sl-credit", "google_promo_credit");

    // Stage 2 Playbook platform tabs
    container.querySelectorAll("[data-pb-group]").forEach((btn) => {
      btn.addEventListener("click", () => {
        activePbGroup = btn.dataset.pbGroup;
        render(container);
      });
    });

    const btnPbAll = container.querySelector("#cs-toggle-pb-all");
    if (btnPbAll) {
      btnPbAll.addEventListener("click", () => {
        const currentGrp = (state.playbook || []).find((g) => g.id === activePbGroup);
        const ids = currentGrp ? currentGrp.cards.map((c) => c.id) : [];
        const allExp = ids.every((id) => expandedPlaybook.has(id));
        if (allExp) ids.forEach((id) => expandedPlaybook.delete(id));
        else ids.forEach((id) => expandedPlaybook.add(id));
        render(container);
      });
    }

    container.querySelectorAll("[data-pb-toggle]").forEach((hdr) => {
      hdr.addEventListener("click", () => {
        const id = hdr.dataset.pbToggle;
        const row = container.querySelector(`[data-pb-row="${id}"]`);
        if (expandedPlaybook.has(id)) {
          expandedPlaybook.delete(id);
          if (row) row.classList.remove("expanded");
        } else {
          expandedPlaybook.add(id);
          if (row) row.classList.add("expanded");
        }
      });
    });

    // Stage 3 Monitor sample presets
    container.querySelectorAll("[data-m-sample]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const s = btn.dataset.mSample;
        if (s === "healthy") {
          state.monitor.inputs = {
            spend: 240,
            impressions: 10500,
            views_3s: 3150,
            link_clicks: 155,
            add_to_carts: 10,
            purchases: 4,
          };
        } else if (s === "leaky_lp") {
          state.monitor.inputs = {
            spend: 210,
            impressions: 9200,
            views_3s: 2950,
            link_clicks: 165,
            add_to_carts: 3,
            purchases: 0,
          };
        } else if (s === "bad_hook") {
          state.monitor.inputs = {

            link_clicks: 42,
            add_to_carts: 3,
            purchases: 1,
          };
        }
        recomputeState();
        render(container);
      });
    });

    container.querySelectorAll("[data-m-key]").forEach((inp) => {
      inp.addEventListener("change", () => {
        const k = inp.dataset.mKey;
        state.monitor.inputs[k] = Number(inp.value || 0);
        recomputeState();
        render(container);
      });
    });

    // Expandable Metric Cards (merged glossary)
    container.querySelectorAll("[data-mc-toggle]").forEach((card) => {
      card.addEventListener("click", () => {
        const id = card.dataset.mcToggle;
        if (expandedMetricCards.has(id)) {
          expandedMetricCards.delete(id);
          card.classList.remove("expanded");
        } else {
          expandedMetricCards.add(id);
          card.classList.add("expanded");
        }
      });
    });

    // Bottom Graduation Chips
    container.querySelectorAll("[data-grad-id]").forEach((chip) => {
      chip.addEventListener("click", () => {
        const id = chip.dataset.gradId;
        for (const item of state.graduation.items || []) {
          if (item.id === id) item.checked = !item.checked;
        }
        recomputeState();
        render(container);
      });
    });

    const btnStep2 = container.querySelector("#cs-goto-step2");
    if (btnStep2) {
      btnStep2.addEventListener("click", () => {
        window.TabRegistry.switchTab("budgetpilot");
      });
    }
  }

  function render(container) {
    if (!state) {
      container.innerHTML = `<p style="margin-top:32px">Loading Cold Start Lab...</p>`;
      return;
    }
    let stageHtml = "";
    if (activeSubStep === "calc") {
      stageHtml = renderStage1Calculator();
    } else if (activeSubStep === "playbook") {
      stageHtml = renderStage2Playbook();
    } else {
      stageHtml = renderStage3Monitor();
    }

    container.innerHTML = `<div class="cs-wizard-shell">
      ${renderStepper()}
      ${stageHtml}
      ${renderCompactGraduationBar()}
    </div>`;
    bindEvents(container);
  }

  async function mount(container) {
    if (!state) {
      if (
        window.__SNAPSHOT_STATE__ &&
        window.__SNAPSHOT_STATE__.tabs &&
        window.__SNAPSHOT_STATE__.tabs.coldstart
      ) {
        state = window.__SNAPSHOT_STATE__.tabs.coldstart;
      } else {
        try {
          const res = await fetch("/api/coldstart/default");
          if (res.ok) {
            state = await res.json();
          }
        } catch (e) {}
      }
    }
    render(container);
  }

  window.TabRegistry.register({
    id: "coldstart",
    step: "Step 1",
    label: {
      zh: "冷启动测款破冰 (Cold Start)",
      en: "Cold Start Lab",
    },
    mount,
    getState() {
      return state;
    },
    setState(newData) {
      state = newData;
    },
  });
})();

  function profitCurve(c) {
    const { L, esc, usd, kfmt } = window.BPCore;
    const W = 360;
    const H = 220;
    const m = { l: 46, r: 14, t: 18, b: 34 };
    const xs = c.curve.x;
    const lo = c.curve.lo;
    const med = c.curve.med;
    const hi = c.curve.hi;
    const ymin = Math.min(0, ...lo);
    const ymax = Math.max(...hi);
    const yt = ticks(ymin, ymax, 4);
    const y0 = Math.min(ymin, yt[0]);
    const y1 = Math.max(ymax, yt[yt.length - 1]);
    const X = lin(0, xs[xs.length - 1], m.l, W - m.r);
    const Y = lin(y0, y1, H - m.b, m.t);
    const xt = ticks(0, xs[xs.length - 1], 4);
    const px = xs.map(X);
    const col = COLOR[c.id];
    const interp = (v) => {
      for (let i = 1; i < xs.length; i++)
        if (xs[i] >= v) {
          const f = (v - xs[i - 1]) / (xs[i] - xs[i - 1]);
          return med[i - 1] + f * (med[i] - med[i - 1]);
        }
      return med[med.length - 1];
    };
    const cur = c.current;
    const tgt = c.target;
    const pk = c.x_opt;
    let g = "";
    yt.forEach((v) => {
      g += `<line class="${v === 0 ? "base" : "grid"}" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(
        v
      )}"/><text x="${m.l - 6}" y="${Y(v) + 3.5}" text-anchor="end">${v < 0 ? "−" : ""}$${kfmt(Math.abs(v))}</text>`;
    });
    xt.forEach((v) => {
      g += `<text x="${X(v)}" y="${H - m.b + 16}" text-anchor="middle">$${kfmt(v)}</text>`;
    });
    g += `<text x="${W - m.r}" y="${H - 4}" text-anchor="end">${esc(t("axSpend"))} →</text>`;
    g += `<path d="${band(px, lo.map(Y), hi.map(Y))}" style="fill:${col};fill-opacity:.13"/>`;
    g += `<path d="${path(px, med.map(Y))}" style="fill:none;stroke:${col};stroke-width:2;stroke-linejoin:round"/>`;
    const pkY = Y(interp(pk));
    g += `<line x1="${X(pk)}" x2="${X(pk)}" y1="${pkY}" y2="${m.t - 2}" style="stroke:var(--ink-2);stroke-width:1"/>`;
    g += `<text x="${X(pk)}" y="${m.t - 6}" text-anchor="${X(pk) > W - 70 ? "end" : "middle"}" class="lbl-ink">${esc(
      t("peak")
    )} ${usd(pk)}</text>`;
    g += `<rect x="${X(pk) - 4}" y="${pkY - 4}" width="8" height="8" transform="rotate(45 ${X(
      pk
    )} ${pkY})" style="fill:var(--ink);stroke:var(--surface);stroke-width:2"/>`;
    g += `<circle cx="${X(cur)}" cy="${Y(interp(cur))}" r="5" style="fill:var(--surface);stroke:var(--ink);stroke-width:2"/>`;
    if (Math.abs(tgt - cur) > 1) {
      g += `<path d="M${X(cur)},${Y(interp(cur))} L${X(tgt)},${Y(
        interp(tgt)
      )}" style="stroke:var(--ink);stroke-width:1.5;fill:none" marker-end="url(#arr-${c.id})"/>`;
      g += `<circle cx="${X(tgt)}" cy="${Y(
        interp(tgt)
      )}" r="5" style="fill:${col};stroke:var(--surface);stroke-width:2"/>`;
    }
    g += `<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}"/><rect class="ov" x="${m.l}" y="${m.t}" width="${
      W - m.l - m.r
    }" height="${H - m.t - m.b}"/>`;
    return `<div class="chart-card"><div class="card-top"><span class="chan"><i class="sw" style="background:${col}"></i>${esc(
      L(c.label)
    )}</span><span class="pill ${c.direction}">${c.direction === "up" ? "↑" : c.direction === "down" ? "↓" : "="} ${esc(
      t(c.direction)
    )}</span></div>
      <svg class="ch" id="pc-${c.id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(L(c.label))}">
        <defs><marker id="arr-${
          c.id
        }" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 Z" style="fill:var(--ink)"/></marker></defs>${g}</svg>
      <div class="cap">${esc(t("axProfit"))}</div></div>`;
  }

  function lineFrame(W, H, m, xDom, yDom, xtickFn, ytickFmt, ytN = 4) {
    const X = lin(xDom[0], xDom[1], m.l, W - m.r);
    const yt = ticks(yDom[0], yDom[1], ytN);
    const y0 = Math.min(yDom[0], yt[0]);
    const y1 = Math.max(yDom[1], yt[yt.length - 1]);
    const Y = lin(y0, y1, H - m.b, m.t);
    let g = "";
    yt.forEach((v) => {
      g += `<line class="${v === y0 ? "base" : "grid"}" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(
        v
      )}"/><text x="${m.l - 6}" y="${Y(v) + 3.5}" text-anchor="end">${ytickFmt(v)}</text>`;
    });
    g += xtickFn(X, H - m.b + 16);
    return {
      X,
      Y,
      g,
      close: `<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}"/><rect class="ov" x="${m.l}" y="${
        m.t
      }" width="${W - m.l - m.r}" height="${H - m.t - m.b}"/>`,
    };
  }

  function plan() {
    const { getLang, L, esc, usd, sUsd, kfmt } = window.BPCore;
    const lang = getLang();
    const W = 520;
    const H = 250;
    const m = { l: 46, r: 120, t: 12, b: 30 };
    const n = D.channels[0].glide.length;
    const ymax = Math.max(...D.channels.flatMap((c) => c.glide)) * 1.08;
    const f = lineFrame(
      W,
      H,
      m,
      [0, n - 1],
      [0, ymax],
      (X, y) =>
        [0, 2, 4, 6, 8, 10]
          .filter((d) => d < n)
          .map(
            (d) =>
              `<text x="${X(d)}" y="${y}" text-anchor="middle">${
                d === 0 ? esc(t("today")) : lang === "zh" ? `第${d}天` : `${t("day")} ${d}`
              }</text>`
          )
          .join(""),
      (v) => "$" + kfmt(v)
    );
    let g = f.g;
    const ends = D.channels.map((c) => ({ c, y: f.Y(c.glide[n - 1]) })).sort((a, b) => a.y - b.y);
    ends[0].ly = ends[0].y;
    for (let i = 1; i < ends.length; i++) ends[i].ly = Math.max(ends[i].y, ends[i - 1].ly + 14);
    D.channels.forEach((c) => {
      g += `<path d="${path(
        c.glide.map((_, i) => f.X(i)),
        c.glide.map(f.Y)
      )}" style="fill:none;stroke:${COLOR[c.id]};stroke-width:2;stroke-linejoin:round"/><circle cx="${f.X(
        n - 1
      )}" cy="${f.Y(c.glide[n - 1])}" r="4" style="fill:${COLOR[c.id]};stroke:var(--surface);stroke-width:2"/>`;
    });
    ends.forEach((e) => {
      g += `<text x="${f.X(n - 1) + 10}" y="${e.ly + 4}" class="lbl-2">${esc(
        L(e.c.label).replace(" (non-brand)", "").replace("（非品牌词）", "")
      )} ${usd(e.c.glide[n - 1])}</text>`;
    });
    const glide = `<svg class="ch" id="glide" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("glideH"))}">${g}${
      f.close
    }</svg>`;

    const cum = D.projection.cum_lift;
    const N = cum.med.length;
    const days = cum.med.map((_, i) => i + 1);
    const W2 = 520;
    const m2 = { l: 52, r: 70, t: 12, b: 30 };
    const f2 = lineFrame(
      W2,
      H,
      m2,
      [1, N],
      [Math.min(0, ...cum.lo), Math.max(...cum.hi)],
      (X, y) =>
        [1, 10, 20, 30]
          .map((d) => `<text x="${X(d)}" y="${y}" text-anchor="middle">${lang === "zh" ? `第${d}天` : `${t("day")} ${d}`}</text>`)
          .join(""),
      (v) => (v < 0 ? "−$" : "$") + kfmt(Math.abs(v))
    );
    const px = days.map(f2.X);
    let g2 = f2.g;
    if (Math.min(...cum.lo) < 0)
      g2 += `<line class="base" x1="${m2.l}" x2="${W2 - m2.r}" y1="${f2.Y(0)}" y2="${f2.Y(0)}"/>`;
    g2 += `<path d="${band(px, cum.lo.map(f2.Y), cum.hi.map(f2.Y))}" style="fill:var(--good);fill-opacity:.12"/>`;
    g2 += `<path d="${path(px, cum.med.map(f2.Y))}" style="fill:none;stroke:var(--good);stroke-width:2"/>`;
    g2 += `<circle cx="${px[N - 1]}" cy="${f2.Y(
      cum.med[N - 1]
    )}" r="4.5" style="fill:var(--good);stroke:var(--surface);stroke-width:2"/><text x="${px[N - 1] + 9}" y="${
      f2.Y(cum.med[N - 1]) + 4
    }" class="lbl-ink">${sUsd(cum.med[N - 1])}</text>`;
    const cumSvg = `<svg class="ch" id="cum" viewBox="0 0 ${W2} ${H}" role="img" aria-label="${esc(t("cumH"))}">${g2}${
      f2.close
    }</svg>`;

    return `<section id="plan"><div class="head"><div><h2>${esc(t("planH"))}</h2><p class="sub">${esc(
      t("planSub")
    )}</p></div></div>
      <div class="two">
        <div class="chart-card"><h3>${esc(t("glideH"))}</h3><div class="legend">${D.channels
      .map((c) => `<span><i class="line" style="background:${COLOR[c.id]}"></i>${esc(L(c.label))}</span>`)
      .join("")}</div>${glide}<div class="cap">${esc(t("glideCap"))}</div></div>
        <div class="chart-card"><h3>${esc(t("cumH"))}</h3><div class="cap">${esc(
      t("cumCap")(sUsd(cum.med[N - 1]), usd(cum.lo[N - 1]), usd(cum.hi[N - 1]))
    )}</div>${cumSvg}</div>
      </div></section>`;
  }

  function bindPlan(root) {
    const { $, getLang, L, esc, usd, sUsd, trow } = window.BPCore;
    const lang = getLang();
    const W = 520;
    const H = 250;
    const m = { l: 46, r: 120, t: 12, b: 30 };
    const n = D.channels[0].glide.length;
    const ymax = Math.max(...D.channels.flatMap((c) => c.glide)) * 1.08;
    const f = lineFrame(W, H, m, [0, n - 1], [0, ymax], () => "", (v) => v);
    const xs = D.channels[0].glide.map((_, i) => f.X(i));
    crosshair(
      $("#glide", root),
      xs,
      D.channels.map((c) => ({ ys: c.glide.map(f.Y), color: COLOR[c.id] })),
      (i) =>
        `<div class="tt">${i === 0 ? esc(t("today")) : lang === "zh" ? `第${i}天` : `${t("day")} ${i}`}</div>` +
        D.channels.map((c) => trow(L(c.label), usd(c.glide[i]), COLOR[c.id])).join("")
    );
    const cum = D.projection.cum_lift;
    const N = cum.med.length;
    const m2 = { l: 52, r: 70, t: 12, b: 30 };
    const f2 = lineFrame(520, H, m2, [1, N], [Math.min(0, ...cum.lo), Math.max(...cum.hi)], () => "", (v) => v);
    crosshair(
      $("#cum", root),
      cum.med.map((_, i) => f2.X(i + 1)),
      [{ ys: cum.med.map(f2.Y), color: "var(--good)" }],
      (i) =>
        `<div class="tt">${lang === "zh" ? `第${i + 1}天` : `${t("day")} ${i + 1}`}</div>${trow(
          t("cumH"),
          sUsd(cum.med[i])
        )}${trow(t("tipRange"), usd(cum.lo[i]) + " – " + usd(cum.hi[i]))}`
    );
  }

  function historySection() {
    const { esc, kfmt } = window.BPCore;
    const tr = D.trend;
    const n = tr.dates.length;
    const W = 520;
    const H = 250;
    const md = (d) => d.slice(5).replace("-", "/");
    const xt = (X, y) =>
      [0, 7, 14, 21, n - 1].map((i) => `<text x="${X(i)}" y="${y}" text-anchor="middle">${md(tr.dates[i])}</text>`).join("");
    const m = { l: 46, r: 16, t: 12, b: 30 };
    const all = tr.net_sales.concat(tr.platform_claimed);
    const f = lineFrame(W, H, m, [0, n - 1], [Math.min(...all) * 0.9, Math.max(...all) * 1.04], xt, (v) => "$" + kfmt(v));
    const px = tr.dates.map((_, i) => f.X(i));
    let g = f.g;
    g += `<path d="${band(
      px,
      tr.net_sales.map(f.Y),
      tr.platform_claimed.map(f.Y)
    )}" style="fill:var(--c-claim);fill-opacity:.08"/>`;
    g += `<path d="${path(px, tr.platform_claimed.map(f.Y))}" style="fill:none;stroke:var(--c-claim);stroke-width:2"/>`;
    g += `<path d="${path(px, tr.net_sales.map(f.Y))}" style="fill:none;stroke:var(--c-truth);stroke-width:2"/>`;
    const truth = `<svg class="ch" id="truth" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("truthH"))}">${g}${
      f.close
    }</svg>`;

    const keys = ["google_brand", "google_nonbrand", "meta", "tiktok"];
    const tot = tr.dates.map((_, i) => keys.reduce((s, k) => s + tr.spend[k][i], 0));
    const f2 = lineFrame(W, H, m, [-0.5, n - 0.5], [0, Math.max(...tot) * 1.05], xt, (v) => "$" + kfmt(v));
    const bw = Math.min(24, (W - m.l - m.r) / n - 2);
    let g2 = f2.g;
    tr.dates.forEach((_, i) => {
      let acc = 0;
      keys.forEach((k, j) => {
        const v = tr.spend[k][i];
        const yTop = f2.Y(acc + v);
        const yBot = f2.Y(acc);
        const gap = j === 0 ? 0 : 2;
        const h = Math.max(0, yBot - yTop - gap);
        const top = j === keys.length - 1;
        g2 += top
          ? `<path d="M${f2.X(i) - bw / 2},${yBot - gap} V${yTop + 2} Q${f2.X(i) - bw / 2},${yTop} ${
              f2.X(i) - bw / 2 + 2
            },${yTop} H${f2.X(i) + bw / 2 - 2} Q${f2.X(i) + bw / 2},${yTop} ${f2.X(i) + bw / 2},${yTop + 2} V${
              yBot - gap
            } Z" style="fill:${COLOR[k]}"/>`
          : `<rect x="${f2.X(i) - bw / 2}" y="${yTop}" width="${bw}" height="${h}" style="fill:${COLOR[k]}"/>`;
        acc += v;
      });
    });
    g2 += `<rect class="ov" x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}"/>`;
    const spend = `<svg class="ch" id="spend" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(
      t("spendH")
    )}">${g2}<line class="xh" x1="0" x2="0" y1="0" y2="0"/></svg>`;

    return `<section id="history"><div class="head"><h2>${esc(t("histH"))}</h2></div><div class="two">
      <div class="chart-card"><h3>${esc(t("truthH"))}</h3><div class="legend"><span><i class="line" style="background:var(--c-truth)"></i>${esc(
      t("lgShop")
    )}</span><span><i class="line" style="background:var(--c-claim)"></i>${esc(
      t("lgClaim")
    )}</span></div>${truth}<div class="cap">${esc(t("truthCap"))}</div></div>
      <div class="chart-card"><h3>${esc(t("spendH"))}</h3><div class="legend">${keys
      .slice()
      .reverse()
      .map((k) => `<span><i style="background:${COLOR[k]}"></i>${esc(chName(k))}</span>`)
      .join("")}</div>${spend}<div class="cap">${esc(t("spendCap"))}</div></div>
    </div></section>`;
  }

  function bindHistory(root) {
    const { $, usd, showTip, hideTip, trow } = window.BPCore;
    const tr = D.trend;
    const n = tr.dates.length;
    const W = 520;
    const H = 250;
    const m = { l: 46, r: 16, t: 12, b: 30 };
    const all = tr.net_sales.concat(tr.platform_claimed);
    const f = lineFrame(W, H, m, [0, n - 1], [Math.min(...all) * 0.9, Math.max(...all) * 1.04], () => "", (v) => v);
    crosshair(
      $("#truth", root),
      tr.dates.map((_, i) => f.X(i)),
      [
        { ys: tr.net_sales.map(f.Y), color: "var(--c-truth)" },
        { ys: tr.platform_claimed.map(f.Y), color: "var(--c-claim)" },
      ],
      (i) =>
        `<div class="tt">${tr.dates[i]}</div>${trow(t("lgShop"), usd(tr.net_sales[i]), "var(--c-truth)")}${trow(
          t("lgClaim"),
          usd(tr.platform_claimed[i]),
          "var(--c-claim)"
        )}`
    );
    const keys = ["tiktok", "meta", "google_nonbrand", "google_brand"];
    const svg = $("#spend", root);
    if (!svg) return;
    $(".ov", svg).addEventListener("pointermove", (e) => {
      const r = svg.getBoundingClientRect();
      const px = ((e.clientX - r.left) * W) / r.width;
      const i = Math.max(0, Math.min(n - 1, Math.round(((px - m.l) / (W - m.l - m.r)) * n - 0.5)));
      showTip(
        `<div class="tt">${tr.dates[i]}</div>` + keys.map((k) => trow(chName(k), usd(tr.spend[k][i]), COLOR[k])).join(""),
        e
      );
    });
    $(".ov", svg).addEventListener("pointerleave", hideTip);
  }

  function audit() {
    const { L, esc, usd, pct } = window.BPCore;
    const rows = D.channels
      .flatMap((c) =>
        ["V", "K", "half_life"].map((k, j) => {
          const p = c.params[k];
          const f = (v) => (k === "half_life" ? v.toFixed(1) : usd(v));
          return `<tr>${
            j === 0
              ? `<td rowspan="3"><span class="chan"><i class="sw" style="background:${COLOR[c.id]}"></i>${esc(
                  L(c.label)
                )}</span></td>`
              : ""
          }
            <td class="mono">${k === "half_life" ? "θ" : k}</td><td>${esc(
            t("mean")[k]
          )} <span style="color:var(--muted)">(${t("unit")[k]})</span></td>
            <td class="r num">${f(p.prior)}</td><td class="r num"><b style="font-weight:500">${f(
            p.med
          )}</b> <span style="color:var(--muted)">(${f(p.lo)}–${f(p.hi)})</span></td></tr>`;
        })
      )
      .join("");
    const a = D.audit;
    const used = new Set(D.channels.flatMap((c) => c.constraints).concat(D.portfolio.constraints));
    const gloss = [...used]
      .map((k) => `<div><span class="code" style="align-self:flex-start">${k}</span><p>${esc(L(GLOSS[k] || { en: k, zh: k }))}</p></div>`)
      .join("");
    return `<section id="audit"><div class="head"><div><h2>${esc(t("audH"))}</h2><p class="sub">${esc(
      t("audSub")
    )}</p></div></div>
      <div class="panel tbl-wrap"><table><thead><tr><th>${esc(t("thCh"))}</th><th>${esc(t("thP"))}</th><th>${esc(
      t("thMean")
    )}</th><th class="r">${esc(t("thPrior"))}</th><th class="r">${esc(
      t("thFit")
    )}</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="below" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
        <div class="panel"><h3 style="margin-bottom:10px">${esc(t("fitH"))}</h3><dl class="kv num" style="margin:0">
          <dt>${esc(t("fR2"))}</dt><dd>${a.r2.toFixed(2)}</dd><dt>${esc(t("fMape"))}</dt><dd>${pct(a.mape, 1)}</dd>
          <dt>${esc(t("fDays"))}</dt><dd>${D.meta.n_days}</dd><dt>${esc(t("fDraws"))}</dt><dd>${a.draws.toLocaleString(
      "en-US"
    )}</dd>
          <dt>${esc(t("fBrand"))}</dt><dd>${usd(a.brand_search_revenue_usd)}</dd><dt>${esc(t("fBase"))}</dt><dd>${usd(
      a.base.med
    )}${t("perDay")}</dd>
          <dt>${esc(t("fRun"))}</dt><dd>${D.meta.runtime_sec}s</dd></dl></div>
        <div class="panel"><h3 style="margin-bottom:10px">${esc(t("chkH"))}</h3><ul class="checks">${a.checklist
      .map(
        (c) =>
          `<li><span class="ok" aria-label="pass">${c.pass ? "✓" : "✕"}</span><span>${esc(L(c.name))}</span></li>`
      )
      .join("")}</ul></div>
        <div class="panel"><h3 style="margin-bottom:10px">${esc(t("glH"))}</h3><div class="gloss">${gloss}</div></div>
      </div></section>`;
  }

  function restoreTodos(root) {
    const { $$ } = window.BPCore;
    $$(".todo input", root).forEach((cb) => {
      try {
        cb.checked = localStorage.getItem(cb.id) === "1";
      } catch (e) {}
      cb.addEventListener("change", () => {
        try {
          localStorage.setItem(cb.id, cb.checked ? "1" : "0");
        } catch (e) {}
      });
    });
  }

  function render(container) {
    const { esc } = window.BPCore;
    if (!D) {
      container.innerHTML = `<p style="margin-top:40px">${esc(t("noData"))}</p>`;
      return;
    }
    container.innerHTML =
      subbar() +
      summary() +
      actions() +
      insights() +
      curves() +
      race() +
      plan() +
      historySection() +
      audit() +
      `<footer>${esc(t("foot")(D.meta.runtime_sec))}</footer>`;

    bindCurves(container);
    bindRace(container);
    bindPlan(container);
    bindHistory(container);
    restoreTodos(container);

    const resolveBtn = container.querySelector("#bp-resolve-btn");
    if (resolveBtn) {
      resolveBtn.addEventListener("click", async () => {
        isSolving = true;
        render(container);
        try {
          const res = await fetch("/api/budgetpilot/solve", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({}),
          });
          if (res.ok) {
            D = await res.json();
          }
        } catch (e) {}
        isSolving = false;
        render(container);
      });
    }
  }

  async function mount(container) {
    if (!D) {
      if (
        window.__SNAPSHOT_STATE__ &&
        window.__SNAPSHOT_STATE__.tabs &&
        window.__SNAPSHOT_STATE__.tabs.budgetpilot
      ) {
        D = window.__SNAPSHOT_STATE__.tabs.budgetpilot;
      } else {
        try {
          const res = await fetch("/api/budgetpilot/data");
          if (res.ok) {
            D = await res.json();
          }
        } catch (e) {}
      }
    }
    render(container);
  }

  window.TabRegistry.register({
    id: "budgetpilot",
    step: "Step 2",
    label: {
      zh: "每日预算调仓 (BudgetPilot)",
      en: "BudgetPilot Action Card",
    },
    mount,
    getState() {
      return D;
    },
    setState(newData) {
      D = newData;
    },
  });
})();


</script>

  <!-- Bootstrap Shell -->
  <script data-inlined="core/app.js">
/**
 * Main Application Shell Bootstrapper for BudgetPilot Agency OS.
 * Initializes language controls, snapshot export button, and mounts the active tab.
 */
(function () {
  function syncShellControls() {
    const { getLang, shellT } = window.BPCore;
    const lang = getLang();

    document.querySelectorAll(".seg button[data-lang]").forEach((btn) => {
      btn.setAttribute("aria-pressed", String(btn.dataset.lang === lang));
    });

    const snapBtn = document.getElementById("btn-snapshot");
    if (snapBtn && !snapBtn.disabled) {
      snapBtn.textContent = shellT("exportSnap");
    }

    const modeBadge = document.getElementById("mode-badge");
    if (modeBadge) {
      const isSnap = Boolean(window.__SNAPSHOT_STATE__);
      modeBadge.textContent = isSnap ? shellT("snapMode") : shellT("liveMode");
      modeBadge.className = isSnap ? "badge snap" : "badge";
    }
  }

  function init() {
    const { setLang, onLangChange } = window.BPCore;

    if (window.__SNAPSHOT_STATE__ && window.__SNAPSHOT_STATE__.tabs) {
      window.TabRegistry.restoreAllStates(window.__SNAPSHOT_STATE__.tabs);
    }

    document.querySelectorAll(".seg button[data-lang]").forEach((btn) => {
      btn.addEventListener("click", () => {
        setLang(btn.dataset.lang);
      });
    });

    const snapBtn = document.getElementById("btn-snapshot");
    if (snapBtn) {
      snapBtn.addEventListener("click", () => {
        window.BPSnapshot.exportStaticSnapshot();
      });
    }

    onLangChange(() => {
      syncShellControls();
      window.TabRegistry.rerenderActive();
    });

    syncShellControls();

    // Determine initial tab from hash, snapshot state, or default to first registered tab (Step 0)
    const hashTab = (window.location.hash || "").replace(/^#/, "");
    const snapTab = window.__SNAPSHOT_STATE__ && window.__SNAPSHOT_STATE__.active_tab;
    const allTabs = window.TabRegistry.getTabs().map((t) => t.id);

    let initialTab = allTabs[0] || "healthcheck";
    if (hashTab && allTabs.includes(hashTab)) {
      initialTab = hashTab;
    } else if (snapTab && allTabs.includes(snapTab)) {
      initialTab = snapTab;
    }

    window.TabRegistry.switchTab(initialTab, false);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();


</script>
