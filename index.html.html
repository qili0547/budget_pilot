  <style data-inlined="styles/main.css">

  --border: rgba(16, 26, 21, .11); --accent: #17493d; --accent-ink: #ffffff; --accent-soft: #e2ede8;
  --c-google: #2a78d6; --c-meta: #eb6834; --c-tiktok: #1baf7a; --c-brand: #aeb3af;
  --c-claim: #4a3aa7; --c-truth: #101a15;
  --good: #0ca30c; --good-ink: #006300; --good-bg: #e5f3e3;

  --serious: #ec835a; --crit: #d03b3b; --crit-ink: #a82828; --crit-bg: #fbe8e6;

  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0e1311; --surface: #171e1b; --surface-2: #1c2521;
    --ink: #eef2ef; --ink-2: #b9c2bd; --muted: #87908b; --grid: #27302c; --axis: #3a4540;
    --border: rgba(255, 255, 255, .10); --accent: #8fd1bd; --accent-ink: #0e1311; --accent-soft: #1f302a;
    --c-google: #3987e5; --c-meta: #d95926; --c-tiktok: #199e70; --c-brand: #5d6561;
    --c-claim: #9085e9; --c-truth: #eef2ef;
    --good-ink: #4cc94c; --good-bg: #16301a; --warn-ink: #f5c04a; --warn-bg: #33290f;
    --crit-ink: #f08a86; --crit-bg: #3a1c1b; --info-ink: #8cb8f0; --info-bg: #182a40;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0e1311; --surface: #171e1b; --surface-2: #1c2521;
  --ink: #eef2ef; --ink-2: #b9c2bd; --muted: #87908b; --grid: #27302c; --axis: #3a4540;
  --border: rgba(255, 255, 255, .10); --accent: #8fd1bd; --accent-ink: #0e1311; --accent-soft: #1f302a;
  --c-google: #3987e5; --c-meta: #d95926; --c-tiktok: #199e70; --c-brand: #5d6561;

* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 0 56px; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
h2 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
.sub { color: var(--ink-2); max-width: 72ch; margin-top: 4px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 11.5px; letter-spacing: .01em; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Sticky Multi-Tab Top Bar */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 15;
  background: color-mix(in srgb, var(--page) 90%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.top .wrap {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 16px;
  padding-block: 10px;
}
.brand-group {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.mark {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 15px;
  letter-spacing: -.01em;
}
.mark svg { width: 22px; height: 22px; }

/* Extensible Tab Bar */
.tab-bar {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 3px;
}
.tab-btn {
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--ink-2);
  padding: 6px 13px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
  transition: background .15s, color .15s;
}
.tab-btn:hover {
  color: var(--ink);
  background: color-mix(in srgb, var(--surface) 70%, transparent);
}
.tab-btn[aria-selected="true"] {
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 600;
  box-shadow: 0 1px 3px rgba(0,0,0,.12);
}
.tab-btn .step-tag {
  font-family: var(--mono);
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 999px;
  background: rgba(128,128,128,.15);
}
.tab-btn[aria-selected="true"] .step-tag {
  background: rgba(255,255,255,.22);
  color: inherit;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.badge {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .05em;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--warn-bg);
  color: var(--warn-ink);
  white-space: nowrap;
}
.badge.snap {
  background: var(--info-bg);
  color: var(--info-ink);
}
.btn-action {
  font: inherit;
  font-size: 12.5px;
  font-weight: 500;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  padding: 5px 12px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background .15s, border-color .15s;
}
.btn-action:hover {
  background: var(--surface-2);
  border-color: var(--axis);
}
.btn-primary {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
  font-weight: 600;
}
.btn-primary:hover {
  opacity: .93;
  background: var(--accent);
}
.btn-primary:disabled {
  opacity: .6;
  cursor: wait;
}

.seg {
  display: inline-flex;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  background: var(--surface);
}
.seg button {
  font: inherit;
  font-size: 12.5px;
  border: 0;
  background: transparent;
  color: var(--ink-2);
  padding: 5px 11px;
  cursor: pointer;
}
.seg button[aria-pressed="true"] {
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 500;
}

section { margin-top: 32px; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px 24px; margin-bottom: 14px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
.pos { color: var(--good-ink); }
.neg { color: var(--crit-ink); }
.code {
  font-family: var(--mono);
  font-size: 11px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--ink-2);
  border-radius: 5px;
  padding: 2px 6px;
  word-break: break-all;
}

footer { margin-top: 40px; color: var(--muted); font-size: 12px; max-width: 90ch; }

/* Tooltip */
#tip {
  position: fixed;
  z-index: 30;
  pointer-events: none;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 12px;
  box-shadow: 0 6px 20px rgba(0,0,0,.14);
  min-width: 150px;
  max-width: 280px;
}
#tip .tt { color: var(--muted); margin-bottom: 4px; }
#tip .tr { display: flex; justify-content: space-between; gap: 14px; }
#tip .tr span:first-child { display: flex; align-items: center; gap: 6px; color: var(--ink-2); }
#tip .tr b { font-weight: 500; font-variant-numeric: tabular-nums; }

@media (max-width: 720px) {
  .wrap { padding-inline: 14px; }
  .tab-bar { width: 100%; overflow-x: auto; }
}

  <style data-inlined="styles/coldstart.css">

.cs-wizard-shell {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* Top 3-Step Sub-Navigation Bar */
.cs-stepper {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 6px;
}
.cs-step-btn {
  font: inherit;
  border: 1px solid transparent;
  border-radius: 9px;
  background: transparent;
  color: var(--ink-2);
  padding: 11px 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;

delayed_popup", "category_number": 3, "mode": "manual", "status": "pending", "critical": false, "weight": 2, "missing_points": 2.0, "title": {"zh": "延迟入口弹窗 (Entry Pop-ups)", "en": "Delay Entry Pop-ups (8–12s delay or 40% scroll trigger)"}, "evidence": {"en": "Awaiting advertiser manual verification.", "zh": "待广告商人工实测勾选确认。"}, "how_to_improve": {"zh": "在 Klaviyo / Privy / 弹窗插件后台将触发条件从 Immediate 改为 Time on page >= 10s 或 Scroll >= 40%。", "en": "Change your Klaviyo/Privy pop-up trigger from 'Immediately' to 'After 8–12 seconds' or 'After 40% page scroll'."}}, {"id": "aov_cross_sell", "category_number": 5, "mode": "manual", "status": "pending", "critical": false, "weight": 2, "missing_points": 2.0, "title": {"zh": "购物车内或购后交叉销售 (Cross-Sell)", "en": "In-Cart or Post-Purchase Cross-Sell (high-margin add-ons)"}, "evidence": {"en": "Awaiting advertiser manual verification.", "zh": "待广告商人工实测勾选确认。"}, "how_to_improve": {"zh": "在侧滑购物车或结账后 (Post-Purchase One-Click Upsell) 增加一键勾选的配件包、延保或优先发货加购项。", "en": "Add a one-click in-cart toggle or post-purchase upsell for replacement attachments, extended warranty, or shipping protection."}}, {"id": "aov_free_ship_bar", "category_number": 5, "mode": "manual", "status": "pending", "critical": false, "weight": 2, "missing_points": 2.0, "title": {"zh": "购物车内的免运费进度条", "en": "In-Cart Free Shipping Progress Bar (set just above 1-unit price)"}, "evidence": {"en": "Awaiting advertiser manual verification.", "zh": "待广告商人工实测勾选确认。"}, "how_to_improve": {"zh": "在侧滑购物车顶部添加动态进度条（如“再买 $10.01 即可享受免运费！”），并将门槛设在单件售价的 1.3–1.4 倍处。", "en": "Add a dynamic progress bar inside the cart drawer ('You are $10.01 away from Free Shipping!') with the threshold set ~35% above single-unit price."}}, {"id": "ret_welcome_flow", "category_number": 7, "mode": "manual", "status": "pending", "critical": false, "weight": 2, "missing_points": 2.0, "title": {"zh": "弹窗订阅用户的欢迎流程 (Welcome Flow)", "en": "Pop-up Subscriber Welcome Flow (immediate discount delivery)"}, "evidence": {"en": " "}], "how_to_improve": {"zh": "请用真实手机和银行卡下 1 单实付订单，在支付后台确认状态为 Captured（已扣款）且 Payout 状态正常、无 KYC 审核冻结。", "en": "Place 1 live order on a mobile phone with a real card. Confirm status is 'Captured' and Payouts are active with no pending KYC holds."}, "checked": false, "status": "pending", "earned_points": 0.0}, {"id": "chk_shipping_zones", "mode": "manual", "weight": 4, "critical": true, "title": {"zh": "核实目标广告投放国家的配送区域和运费", "en": "Verify shipping zones and rates for all target ad countries"}, "bullets": [{"zh": "测试您计划在广告系列中定位的每个国家/州的地址（例如：美国、加拿大、英国、澳大利亚）。", "en": "Test addresses across every country/state you plan to target in ad campaigns (e.g., US, CA, UK, AU)."}, {"zh": "确认客户在结账时绝不会看到“您的地址无可用配送方式 (No shipping rates available for your address)”的提示。", "en": "Confirm shoppers never hit 'No shipping rates available for your address' at checkout."}], "how_to_improve": {"zh": "前往后台 Settings -> Shipping and delivery，为所有计划投放的国家/州及重量区间配置兜底运费方案，并用目标国测试邮编逐一验证。", "en": "In Settings -> Shipping and delivery, configure fallback weight/price rates for every targeted country/state and test with sample postal codes."}, "checked": false, "status": "pending", "earned_points": 0.0}, {"id": "chk_discount_codes", "mode": "manual", "weight": 3, "critical": false, "title": {"zh": "测试所有折扣码", "en": "Test all active discount codes & bundle combinations"}, "bullets": [{"zh": "在购物车/结账页面测试您的欢迎弹窗折扣码（例如：WELCOME10）以及任何广告专属促销码，确保它们能正常生效，且不会与捆绑销售折扣 (bundle discounts) 发生冲突。", "en": "Test welcome pop-up codes (e.g., WELCOME10) and ad-specific promo codes in cart/checkout to ensure they apply properly and do not break bundle discounts."}], "how_to_improve": {"zh": "在 Shopify 折扣设置中检查 Combinations（叠加规则），确保欢迎码/广告折扣码在单件与多件 Bundle 下要么正常叠加、要么给出清晰提示。", "en": "Check Discount Combinations in your store admin so welcome/ad promo codes work cleanly alongside quantity break or bundle offers."}, "checked": false, "status": "pending", "earned_points": 0.0}, {"id": "chk_guest_checkout", "mode": "manual", "weight": 3, anual", "weight": 4, "critical": true, "title": {"zh": "验证所有漏斗事件是否正确触发（含 AJAX 侧滑购物车）", "en": "Verify all funnel events fire accurately (including AJAX slide-out cart drawer)"}, "bullets": [{"zh": "PageView 和 ViewContent 在产品落地页正常触发，并带有 content_ids、value 和 currency 参数。", "en": "PageView and ViewContent fire on the product landing page with content_ids, value, and currency parameters."}, {"zh": "点击“加入购物车”时触发 AddToCart —— 关键检查：如果网站使用侧滑式 AJAX 购物车抽屉 (slide-out AJAX cart drawer)，请通过 Meta/TikTok Pixel Helper 验证点击“加入购物车”和抽屉内的“去结账 (Checkout)”按钮确实触发 AddToCart 和 InitiateCheckout！", "en": "AddToCart fires on click — Critical check: if using a slide-out AJAX cart drawer, verify via Meta/TikTok Pixel Helper that both 'Add to Cart' and the drawer's 'Checkout' button trigger AddToCart and InitiateCheckout."}, {"zh": "Purchase 在感谢页面 (Thank You page) 上仅触发一次（刷新页面不会重复触发），并传递准确的动态订单金额和货币单位。", "en": "Purchase fires exactly once on the Thank You page (no duplicate fire on page reload) and passes dynamic order value and currency."}], "how_to_improve": {"zh": "使用 Meta Pixel Helper 与 TikTok Pixel Helper 浏览器插件走完 ViewContent -> AddToCart (侧滑抽屉) -> InitiateCheckout -> Purchase 全链路，修复缺失事件或缺失的 value/currency 参数。", "en": "Walk through ViewContent -> AddToCart (AJAX drawer) -> InitiateCheckout -> Purchase with Meta/TikTok Pixel Helper extensions and fix any silent buttons or missing value/currency payloads."}, "checked": false, "status": "pending", "earned_points": 0.0}, {"id": "trk_utm_persistence", "mode": "auto", "weight": 6, "critical": true, "title": {"zh": "UTM 与点击 ID (Click ID) 持久性测试（自动跳转验证）", "en": "UTM & Click ID (fbclid / ttclid / gclid) redirect persistence test"}, "bullets": [{"zh": "自动访问附带测试参数的落地页 URL：?utm_source=test&fbclid=test123&ttclid=test456&gclid=test789。", "en": "Automatically requests the landing page URL with ?utm_source=test&fbclid=test123&ttclid=test456&gclid=test789."}, {"zh": "确认 http -> https 或 non-www -> www 重定向、货币切换器或国家跳转不会剥离（丢失）这些查询参数。", "en": "Confirms http -> https,  {"id": "mob_page_speed", "mode": "manual", "weight": 3, "critical": false, "title": {"zh": "页面加载速度检查（移动端 LCP < 2.5 秒）", "en": "Mobile Page Speed check (Largest Contentful Paint LCP < 2.5s)"}, "bullets": [{"zh": "验证移动端的最大内容绘制 (Largest Contentful Paint, LCP) < 2.5 秒（通过 Google PageSpeed Insights 进行测试）。", "en": "Verify mobile Largest Contentful Paint (LCP) is under 2.5 seconds via Google PageSpeed Insights."}], "how_to_improve": {"zh": "压缩首屏 Hero 主图（转为 WebP 且 < 150KB），为首屏主图添加 fetchpriority=\"high\" 并移除未使用的第三方 Shopify 应用脚本。", "en": "Compress your hero image (WebP < 150KB), add fetchpriority='high' on the hero image, and remove unused third-party app scripts."}, "checked": false, "status": "pending", "earned_points": 0.0}], "earned_points": 0.0, "max_points": 13}, {"id": "cat_cro", "number": 4, "title": {"zh": "4. 宠物激光玩具落地页转化率优化 CRO（将点击转化为买家）", "en": "4. Landing Page CRO (Convert Paid Clicks into Buyers)"}, "subtitle": {"zh": "宠物主人的购买决策基于情感演示（看到宠物为玩具疯狂），其次是对安全性/耐用性的放心感。", "en": "Pet owners buy from emotional proof (seeing pets go crazy for the toy) backed by reassurance on eye safety and durability."}, "items": [{"id": "cro_above_fold", "mode": "manual", "weight": 4, "critical": false, "title": {"zh": "首屏核心要素（在手机上无需滚动即可看到）", "en": "Above-the-Fold Essentials (visible on mobile without scrolling)"}, "bullets": [{"zh": "清晰的、以利益点为导向的标题（例如：“解放双手的室内猫狗互动运动玩具 (Hands-Free Interactive Exercise for Indoor Cats & Dogs)”）。", "en": "Clear, benefit-driven headline (e.g., 'Hands-Free Interactive Exercise for Indoor Cats & Dogs')."}, {"zh": "星级评分 + 评价数量（点击可平滑跳转到评价区域）。", "en": "Star rating + review count (clickable to smooth-scroll down to the review section)."}, {"zh": "清晰的价格、对比锚定原价（如果在促销中），以及高对比度的加入购物车 (Add to Cart) 按钮。", "en": "Clear price, compare-at anchor price (if on sale), and a high-contrast Add to Cart button."}], "how_to_improve": {"zh": "精简移动端首屏上方空白和冗长导语，确保手机第一屏内同时露出：利益点标题、星级评价锚点、促销价/原价对比、以及醒目的 Add to Cart 按钮。", "en": "Tighten mobile vertical spacing so the benefit headline, star rating link, sale/compare price, and high-contrast Add to Cart button all appear above the fold."}, "checked": false, "status": "pending", "earned_points": 0.0}, {"id": "cro_visual_gallery", "mode": "manual", "weight": 3, "critical": false, "title": {"zh": "能解答所有疑问的视觉图库（4 类核心视觉）", "en": "Question-Answering Visual Gallery (4 core visuals)"}, "bullets": [{"zh": "图 1 / 视频 1：清晰的主图 (Hero shot) + 真实猫咪/狗狗玩耍激光的短视频循环播放。", "en": "Image 1 / Video 1: Clean hero shot + short looping clip of real cats/dogs chasing the laser."}, {"zh": "图 2：工作原理（例如：360° 不规则轨迹模式、可调节速度/角度）。", "en": "Image 2: How it works (e.g., 360° unpredictable trajectory patterns, adjustable speed/angle)."}, {"zh": "图 3：便捷功能（例如：USB-C 充电对比普通电池、15 分钟自动关闭定时器以防宠物过度疲劳、静音马达）。", "en": "Image 3: Convenience features (USB-C rechargeable vs disposable batteries, 15-min auto-shutoff timer, whisper-quiet motor)."}, {"zh": "图 4：尺寸/规格以及包装盒内物品清单 (What's in the box)。", "en": "Image 4: Dimensions/specs and 'What's in the box' checklist graphic."}], "how_to_improve": {"zh": "按顺序补齐产品主图轮播的 4 张核心信息图（实拍互动视频、360° 轨迹原理图、USB-C/静音/定时功能对比图、包装尺寸清单图）。", "en": "Update your product gallery to include all 4 slides in order: Hero + real pet video loop, 360° trajectory diagram, USB-C/timer/quiet motor callouts, and What's in the Box."}, "checked": false, "status": "pending", "earned_points": 0.0}, {"id": "cro_faq_objections", "mode": "manual", "weight": 3, "critical": false, "title": {"zh": "在页面上解决宠物主人最关心的 5 大顾虑（FAQ 折叠面板）", "en": "Address the Top 5 Pet-Owner Objections (FAQ Accordion)"}, "bullets": [{"zh": "1. “激光对宠物的眼睛安全吗？”（解释 Class 1/2 低功率安全认证和漫反射角度设计）。", "en": "1. 'Is the laser safe for my pet's eyes?' (Explain Class 1/2 low-power safety certification and indirect floor angle)."}, {"zh": "2. “马达声音大吗？会吓到胆小的猫咪吗？”（提及分贝级别 / 极静齿轮设计）。", "en": "2. 'Is the motor loud? Will it scare timid cats?' (Mention decibel level / ultra-quiet gear design)."}, {"zh": "3. “如果我的猫/狗不理睬它怎么办？”（突出强调您的 30 天无风险退款保证）。", "en": "3. 'What if my cat/dog ignores it?' (Highlight your 30-day risk-free money-back guarantee)."}, {"zh": "4. “我应该把它放在哪里？”（给出放置地面与桌面高度的建议）。", "en": "4. 'Where should I place it?' (Provide floor vs. tabletop height recommendations)."}, {"zh": "5. “物流需要多久，从哪里发货？”（明确说明订单处理时间 + 配送工作日天数）。", "en": "5. 'How long does shipping take and where does it ship from?' (State exact handling time + transit business days)."}], "how_to_improve": {"zh": "在产品详情页添加折叠式 FAQ 面板，逐条写明眼睛安全认证 (Class 1/2)、静音分贝、30 天不玩包退、摆放高度和发货时效。", "en": "Add an expandable FAQ accordion on the product page explicitly answering all 5 objections (Eye safety, Motor noise, 30-day guarantee, Placement, Shipping time)."}, "checked": false, "status": "pending", "earned_points": 0.0}, {"id": "cro_social_proof", "mode": "manual", "weight": 3, "critical": false, "title": {"zh": "真实的社交证明 (Authentic Social Proof)", "en": "Authentic Social Proof (real customer pet photos & videos)"}, "bullets": [{"zh": "包含带有用户上传的自家宠物与玩具同框的照片/视频的客户评价（避免使用明显虚假的速卖通一词机翻评价）。", "en": "Include customer reviews featuring user-uploaded photos/videos of their own pets playing with the toy (delete obvious one-word or machine-translated AliExpress reviews)."}], "how_to_improve": {"zh": "清理只有“Good / Fast shipping”的低质机翻评论，置顶 6–10 条带真实居家猫咪/狗狗实拍图和视频的长评。", "en": "Remove generic 'Good item' AliExpress imports and pin 6–10 detailed reviews containing real customer photos and videos of pets with the product."}, "checked": false, "status": "pending", "earned_points": 0.0}], "earned_points": 0.0, "max_points": 13}, {"id": "cat_aov", "number": 5, "title": {"zh": "5. 单位经济效益与客单价 (AOV) 提升策略（让广告实现盈利）", "en": "5. Unit Economics & AOV Boosters (Make Paid Ads Profitable)"}, "subtitle": {"zh": "提高平均订单价值 (AOV)，这样您才能承受得起付费广告的单次获客成本 (CPA)。", "en": "Raise Average Order Value (AOV) so your gross margin per order can comfortably absorb paid acquisition costs (CPA)."}, "items": [{"id": "aov_quantity_breaks", "mode": "manual", "weight": 3, "critical": false, "title": {"zh": "产品页面上的阶梯折扣 / 多件捆绑销售 (Quantity Breaks / Multi-Unit 如“再买 $10.01 即可享受免运费！”），并将门槛设在单件售价的 1.3–1.4 倍处。", "en": "Add a dynamic progress bar inside the cart drawer ('You are $10.01 away from Free Shipping!') with the threshold set ~35% above single-unit price."}, "checked": false, "status": "pending", "earned_points": 0.0}], "earned_points": 0.0, "max_points": 7}, {"id": "cat_trust", "number": 6, "title": {"zh": "6. 信任度、法律条款与政策合规（防止广告账户被封）", "en": "6. Trust, Legal Policies & Compliance (Prevent Ad Account Bans)"}, "subtitle": {"zh": "Google Merchant Center 和 Meta 会定期使用自动化机器人抓取页脚链接和联系方式。", "en": "Google Merchant Center and Meta bots routinely crawl footer policy links and business contact details."}, "items": [{"id": "trst_legal_pages", "mode": "auto", "weight": 5, "critical": true, "title": {"zh": "完整的页脚法律条款页面（自动扫描 4 大条款链接与可达性）", "en": "Complete Footer Legal Policy Pages (auto-scanned links & HTTP status)"}, "bullets": [{"zh": "隐私政策 (Privacy Policy)、服务条款 (Terms of Service)、退款/退货政策 (Refund/Return Policy) 和物流政策 (Shipping Policy) 需链接在网站页脚和结账页面中。", "en": "Privacy Policy, Terms of Service, Refund/Return Policy, and Shipping Policy must be linked in the website footer and checkout."}], "how_to_improve": {"zh": "在 Settings -> Policies 中生成并完善 Privacy、Terms、Refund、Shipping 四项政策，并将其全部挂载到网站 Footer 导航菜单中。", "en": "Publish Privacy Policy, Terms of Service, Refund Policy, and Shipping Policy in store settings and link all four visibly in the footer menu."}, "auto_status": "pending", "auto_points": 0.0, "manual_override": false, "status": "pending", "earned_points": 0.0, "evidence": {"en": "Enter your store URL above and click Auto-Scan to verify automatically.", "zh": "请在上方输入店铺网址并点击“开始自动验证”进行检测。"}, "details": []}, {"id": "trst_contact_page", "mode": "auto", "weight": 5, "critical": true, "title": {"zh": "完整的“联系我们 (Contact Us)”页面（自动扫描邮箱/表单/地址电话）", "en": "Complete 'Contact Us' Page (auto-scanned email, form & address/phone)"}, "bullets": [{"zh": "包含至少两种联系方式（品牌域名邮箱，如 support@yourdomain.com + 联系表单，外加营业地址/电话号码——如果投放 Google 购物广告，此项为强制要求）。", "en": "Include at least two contact methods (branded email like support@yourdomain.com + contact form, plus physical address/phone number—mandatory for Google Shopping/GMC)."}], "how_to_improve": {"zh": "确保页脚有可访问的 Contact Us 页面，并在页面正文中明确写出品牌域名客服邮箱 (support@...)、真实办公地址、联系电话及留言表单。", "en": "Link a Contact Us page in the footer containing a branded support@domain email, a contact form, a physical business address, and a phone number."}, "auto_status": "pending", "auto_points": 0.0, "manual_override": false, "status": "pending", "earned_points": 0.0, "evidence": {"en": "Enter your store URL above and click Auto-Scan to verify automatically.", "zh": "请在上方输入店铺网址并点击“开始自动验证”进行检测。"}, "details": []}, {"id": "trst_no_placeholders", "mode": "auto", "weight": 5, "critical": true, "title": {"zh": "零占位符文本或死链（自动扫描模板残留文案与失效社媒链接）", "en": "Zero Placeholder Text or Dead Links (auto-scanned template text & links)"}, "bullets": [{"zh": "检查确保没有任何 Lorem ipsum 测试文本块、默认主题文本（如 \"Talk about your brand\"），或者页脚中指向 facebook.com/shopify 或 404 页面的社交媒体图标。", "en": "Ensure there are no 'Lorem ipsum' blocks, default theme text ('Talk about your brand'), or footer social icons pointing to facebook.com/shopify or 404 pages."}], "how_to_improve": {"zh": "删除页面中残留的 Lorem ipsum 或 'Talk about your brand' 默认模块，并将页脚社媒图标指向真实的品牌主页（若无则隐藏图标），修复所有 404 链接。", "en": "Remove all 'Lorem ipsum' or 'Talk about your brand' theme placeholders, point social icons to your real brand profiles (or hide unused icons), and fix any 404 footer links."}, "auto_status": "pending", "auto_points": 0.0, "manual_override": false, "status": "pending", "earned_points": 0.0, "evidence": {"en": "Enter your store URL above and click Auto-Scan to verify automatically.", "zh": "请在上方输入店铺网址并点击“开始自动验证”进行检测。"}, "details": []}, {"id": "trst_https_ssl", "mode": "auto", "weight": 2, "critical": true, "title": {"zh": "有效的 SSL 证书 (https://)（自动验证加密连接）", "en": "Valid SSL/TLS Certificate (https://) (auto-verified)"}, "bullets": [{"zh": "全站启用有效的 HTTPS 加密证书，且 HTTP 请求自动跳转至 HTTPS。", "en": "Site serves over valid HTTPS with clean certificate chain and automatic HTTP-to-HTTPS redirect."}], "how_to_improve": {"zh": "在域名设置中检查 SSL 证书签发状态，确保根域名与 www 子域名均启用 HTTPS 强制跳转。", "en": "Verify TLS certificate provisioning in your domain settings and force HTTPS redirects on both apex and www domains."}, "auto_status": "pending", "auto_points": 0.0, "manual_override": false, "status": "pending", "earned_points": 0.0, "evidence": {"en": "Enter your store URL above and click Auto-Scan to verify automatically.", "zh": "请在上方输入店铺网址并点击“开始自动验证”进行检测。"}, "details": []}, {"id": "trst_favicon", "mode": "auto", "weight": 2, "critical": false, "title": {"zh": "已上传自定义网站图标 Favicon（自动检测图标配置）", "en": "Custom Website Favicon uploaded (auto-detected)"}, "bullets": [{"zh": "已上传自定义网站图标 Favicon（不是空白地球图标或建站平台默认图标）。", "en": "Custom brand Favicon is configured in HTML head and reachable (not a blank globe or default platform icon)."}], "how_to_improve": {"zh": "在 Online Store -> Themes -> Customize -> Theme settings -> Logo / Favicon 中上传 32x32 或 64x64 的品牌图标。", "en": "Upload a 32x32 or 64x64 brand icon under Theme Settings -> Logo / Favicon."}, "auto_status": "pending", "auto_points": 0.0, "manual_override": false, "status": "pending", "earned_points": 0.0, "evidence": {"en": "Enter your store URL above and click Auto-Scan to verify automatically.", "zh": "请在上方输入店铺网址并点击“开始自动验证”进行检测。"}, "details": []}, {"id": "trst_dns_email", "mode": "auto", "weight": 4, "critical": false, "title": {"zh": "域名邮件送达率认证：SPF / DMARC 记录（自动 DNS 查询验证）", "en": "Domain Email Deliverability: SPF & DMARC DNS records (auto-verified)"}, "bullets": [{"zh": "在您的域名上配置了 SPF / DKIM / DMARC 记录，以确保订单确认邮件和弃购挽回邮件不会进入垃圾箱 (Spam)。", "en": "SPF, DKIM, and DMARC records configured on your root domain so order confirmations and abandoned cart emails do not land in Spam."}], "how_to_improve": {"zh": "在域名 DNS 服务商（如 Cloudflare / GoDaddy）后台添加 TXT 记录：根域名配置 v=spf1 ...，以及 _dmarc 子域名配置 v=DMARC1; p=none/quarantine; rua=mailto:...。", "en": "Add DNS TXT records at your registrar: a root TXT record starting with 'v=spf1' and a '_dmarc' TXT record starting with 'v=DMARC1; p=none;'."}, "auto_status": "pending", "auto_points": 0.0, "manual_override": false, "status": "pending", "earned_points": 0.0, "evidence": {"en": "Enter your store URL above and click Auto-Scan to verify automatically.", "zh": "请在上方输入店铺网址并点击“开始自动验证”进行检测。"}, "details": []}], "earned_points": 0.0, "max_points": 23}, {"id": "cat_retention", "number": 7, "title": {"zh": "7. 自动化留存与挽回流程（挽救今天未购买的 95% 访客）", "en": "7. Automated Retention & Recovery Flows (Rescue the 95% Who Don't Buy Today)"}, "subtitle": {"zh": "大多数访客不会在第一次点击时购买；邮件/短信自动化流程可以免费挽回 10%–20% 的流失营收。", "en": "Most visitors do not buy on their first click; automated email/SMS flows recover 10%–20% of lost revenue for free."}, "items": [{"id": "ret_abandoned_cart", "mode": "manual", "weight": 3, "critical": false, "title": {"zh": "放弃购物车 / 放弃结账邮件序列（3 封邮件）", "en": "Abandoned Cart / Abandoned Checkout 3-Email Sequence (1h / 24h / 48h)"}, "bullets": [{"zh": "邮件 1（1 小时后）：贴心的提醒（“您的宠物刚刚分心了吗？已为您保留好购物车商品 (Did your pet get distracted? Your cart is saved)”）。", "en": "Email 1 (After 1 hour): Warm reminder ('Did your pet get distracted? Your cart is saved')."}, {"zh": "邮件 2（24 小时后）：解答安全性/质量方面的常见疑问 (FAQ) + 展示客户好评。", "en": "Email 2 (After 24 hours): Answer eye-safety/quality FAQs + showcase customer reviews."}, {"zh": "邮件 3（48 小时后）：小额激励（例如：24 小时内有效的 9 折优惠 [10% off] 或免运费），以促成最终转化。", "en": "Email 3 (After 48 hours): Small incentive (e.g., 10% off or Free Shipping valid for 24 hours) to close the sale."}], "how_to_improve": {"zh": "在 Klaviyo / Shopify Email 中激活 3 封弃购挽回序列（1h 提醒 -> 24h 信任答疑 -> 48h 限时 10% 折扣码）。", "en": "Activate a 3-step Abandoned Cart/Checkout flow in Klaviyo or Shopify Email (1h reminder -> 24h FAQ/reviews -> 48h 10% off urgency code)."}, "checked": false, "status": "pending", "earned_points": 0.0}, {"id": "ret_welcome_flow", "mode": "manual", "weight": 2, "critical": false, "title": {"zh": "弹窗订阅用户的欢迎流程 (Welcome Flow)", "en": "Pop-up Subscriber Welcome Flow (immediate discount delivery)"}, "bullets": [{"zh": "用户注册后立即发送承诺的折扣码（请务必用您自己的个人邮箱亲自测试一下！）。", "en": "Send the promised discount code immediately upon sign-up (test it yourself with a personal email address!)."}], "how_to_improve": {"zh": "用全新的个人邮箱填写一次网站欢迎弹窗，确认 1 分钟内收到欢迎邮件、未进垃圾箱且折扣码可点击自动带入结账。", "en": "Submit a fresh personal email into your welcome pop-up and verify the email arrives within 1 minute in the primary inbox with a working discount code."}, "checked": false, "status": "pending", "earned_points": 0.0}, {"id": "ret_order_confirmation", "mode": "manual", "weight": 2, "critical": false, "title": {"zh": "订单确认与物流追踪邮件", "en": "Branded Order Confirmation & Shipping Tracking Emails"}, "bullets": [{"zh": "带有您的品牌 Logo、清晰的客服邮箱以及切合实际的物流时效预期，以防止买家产生购后懊悔 (buyer's remorse) 和发起拒付 (chargebacks)。", "en": "Includes your brand logo, clear support email, and realistic delivery timeframe expectations to prevent buyer's remorse and chargebacks."}], "how_to_improve": {"zh": "在 Settings -> Notifications 中为订单确认与发货通知邮件上传品牌 Logo，并在邮件顶部写明预计处理与派送天数及客服邮箱。", "en": "In Settings -> Notifications, customize Order Confirmation and Shipping emails with your logo, support email, and clear processing + transit day expectations."}, "checked": false, "status": "pending", "earned_points": 0.0}], "earned_points": 0.0, "max_points": 7}]}, "coldstart": {"calculator": {"inputs": {"aov": 55.0, "gross_margin_pct": 65.0, "test_adsets": 4, "google_promo_credit": 500.0}, "breakeven_cpa": 35.75, "cogs_per_order": 19.25, "breakeven_roas": 1.54, "stop_loss": {"noise_hold_usd": 29.0, "soft_kill_usd": 54.0, "hard_kill_usd": 79.0}, "budget_plan": {"daily_per_adset_usd": 20.0, "daily_meta_usd": 80.0, "daily_google_usd": 35.0, "daily_total_usd": 115.0, "total_14d_usd": 1610.0, "meta_14d_usd": 1120.0, "google_14d_usd": 490.0, "applied_google_credit_usd": 490.0, "net_out_of_pocket_14d_usd": 1120.0, "meta_share": 0.7, "google_share": 0.3}}, "playbook": [{"id": "perk_credits", "badge": {"zh": "💰 必领官方羊毛", "en": "💰 Free Ad Credits"}, "title": {"zh": "开户第一步：先领 Google Ads $500 官方赠金 + Meta 防封卡设置", "en": "Step 1: Claim Google Ads $500 Promo Credit & Meta Anti-Ban Warmup"}, "summary": {"zh": "白拿 $500 测试弹药，避免新账户第一天因风控或绑卡问题被封。", "en": "Unlock $500 in free Google test budget and prevent day-1 Meta account locks."}, "cards": [{"id": "google_500_credit", "tag": {"zh": "立省 $500", "en": "Save $500"}, "tag_type": "pass", "title": {"zh": "Google Ads 新户「满 $500 返 $500」官方赠金 (Promo Credit)", "en": "Google Ads New Advertiser '$500 Spend -> $500 Credit' Offer"}, "bullets": [{"zh": "领取方式：通过 Shopify 后台的「Google & YouTube」官方渠道插件创建并绑定全新的 Google Ads 账户（或访问 Google Ads 官网新户促销页），系统会自动挂载新户优惠码（通常有三档：满 $500 返 $500 / 满 $1,000 返 $1,000 / 满 $1,500 返 $1,500，冷启动选 $500 档最稳）。", "en": "How to claim: Create your new Google Ads account directly inside Shopify's official 'Google & YouTube' app (or via the Google Ads new-account promo page). Select the 'Spend $500, Get $500' tier for the easiest cold-start qualification."}, {"zh": "生效规则：自首个广告产生曝光起 60 天内累计消耗满 $500（不含税），Google 会在 5–7 个工作日内将 $500 赠金直接充入账户（可在 Tools -> Billing -> Promotions 查看进度条）。", "en": "How it works: Spend $500 within 60 days of your first impression. Google automatically credits $500 to your Billing -> Promotions balance within ~5 days to offset future spend."}, {"zh": "避坑提醒：绑卡必须使用与公司/个人账单地址一致的实体信用卡（勿用虚拟黑卡），且前 14 天不要频繁更换付款卡，否则会触发 Suspicious Payment 封户。", "en": "Pro tip: Use a real physical credit card matching your billing address (avoid disposable virtual cards) and do not swap cards during the first 14 days to avoid 'Suspicious Payment' suspensions."}]}, {"id": "meta_account_warmup", "tag": {"zh": "防封必看", "en": "Anti-Ban"}, "tag_type": "warn", "title": {"zh": "Meta (Facebook / Instagram) 新户防封与账单阈值 (Billing Threshold) 须知", "en": "Meta New Ad Account Warmup & Billing Threshold Rules"}, "bullets": [{"zh": "开启双重验证 (2FA)：在商务管理平台 (Business Manager -> Security Center) 强制开启管理员 2FA，并在 Domains 中完成独立站域名 DNS TXT 验证。", "en": "Enable 2FA & Domain Verification: Turn on Two-Factor Authentication in Business Manager Security Center and verify your store domain via DNS TXT."}, {"zh": "小额多次扣款机制：Meta 新户初始账单门槛通常只有 $2~$10（每花几美金就会刷一次卡）。请确保信用卡额度充足且未开启海外高频小额拒付拦截，连续扣款成功 5–10 次后门槛会自动升至 $50->$250。", "en": "Small initial billing thresholds: New Meta accounts charge your card every $2–$10 at first. Ensure your bank does not block frequent small charges; after 5–10 clean charges, your threshold rises automatically."}, {"zh": "首周预算平滑原则：前 3 天日预算起步建议 $40–$80/天，切勿第一天设 $30、第二天直接拉到 $500，剧烈跳变极易触发风控人工审核。", "en": "Smooth day-1 budgets: Start at $40–$80/day total for the first 3 days. Never jump from $30 to $500 overnight on a brand-new account."}]}]}, {"id": "google_setup", "badge": {"zh": "🟦 Google 抄作业设置", "en": "🟦 Google Setup Blueprint"}, "title": {"zh": "Google Ads 冷启动零负担设置（选什么 Campaign、怎么出价、关哪 3 个吞金开关）", "en": "Google Ads Cold-Start Setup (Campaign Type, Bidding & 3 Money-Trap Switches to Turn OFF)"}, "summary": {"zh": "核心原则：0 转化期只买“精准高购买意向词”，绝不开 PMax 喂垃圾网盟流量。", "en": "Core rule: With 0 conversion history, buy only high-intent exact/phrase searches—never start with PMax."}, "cards": [{"id": "google_campaign_type", "tag": {"zh": "Campaign 类型", "en": "Campaign Type"}, "tag_type": "pass", "title": {"zh": "选什么广告类型？✅ 选 Search (搜索) + Standard Shopping (标准购物) · 🚫 别选 PMax", "en": "Which Campaign Type? ✅ Search + Standard Shopping · 🚫 Do NOT start with PMax"}, "bullets": [{"zh": "✅ 必开 1 — Search (高意向搜索广告)：只投包含购买意图的词组匹配 (Phrase Match \"...\") 和完全匹配 (Exact Match [...])，例如 [automatic cat laser toy]、\"interactive laser toy for indoor cats\"。", "en": "✅ Start with Search (High-Intent Phrase & Exact Match): Target bottom-of-funnel keywords like [automatic cat laser toy] and \"interactive laser toy for indoor cats\"."}, {"zh": "✅ 必开 2 — Standard Shopping (标准购物广告)：直接展示产品图+价格，点击意图极高且 CPC 通常比搜索词便宜 30%–50%。", "en": "✅ Pair with Standard Shopping: Shows product image + price upfront; high buyer intent with 30%–50% lower CPCs than text search."}, {"zh": "🚫 为什么冷启动严禁开 Performance Max (PMax)？PMax 是全自动黑盒，在账户没有 30–50 个真实 Purchase 转化前，算法不知道谁是买家，会把预算大量浪费在低质 YouTube/Display 游戏应用展示和已有品牌词上！", "en": "🚫 Why avoid Performance Max (PMax) in Cold Start? Without 30–50 historical purchases, PMax dumps budget into low-quality Display/YouTube placements and cannibalizes brand searches."}]}, {"id": "google_bidding", "tag": {"zh": "Bidding 出价策略", "en": "Bidding Strategy"}, "tag_type": "info", "title": {"zh": "选什么出价策略？✅ 前 15 单用 Maximize Clicks (设 CPC 上限) → 满 15 单切 Maximize Conversions", "en": "Which Bidding Strategy? ✅ Maximize Clicks (with Max CPC Cap) -> Switch to Maximize Conversions after 15 sales"}, "bullets": [{"zh": "阶段 1（0–15 单破冰期）：Bidding 选「Maximize Clicks (尽可能争取更多点击)」，并务必勾选「Set a maximum cost per click bid limit (设置最高 CPC 上限 = $1.50 ~ $2.50)」，防止单次点击被系统竞价到 $8–$15！", "en": "Phase 1 (0–15 orders): Choose 'Maximize Clicks' and check 'Set a maximum CPC bid limit' ($1.50–$2.50) so Google never charges $10+ for a single click."}, {"zh": "阶段 2（累积 15–30 单后）：Pixel 已有足够购买人群画像，此时将出价策略切换为「Maximize Conversions (尽可能提高转化次数)」或设定目标 ROAS (tROAS)。", "en": "Phase 2 (After 15–30 orders): Switch bidding to 'Maximize Conversions' (or Target ROAS) once Google Ads has real buyer conversion signals."}]}, {"id": "google_traps", "tag": {"zh": "🛡️ 必关吞金开关", "en": "🛡️ Turn OFF Traps"}, "tag_type": "fail", "title": {"zh": "新手必关的 3 个默认“吞金开关” + 必加否定词 (Negative Keywords)", "en": "3 Default Money-Trap Switches You MUST Turn OFF + Negative Keywords"}, "bullets": [{"zh": "❌ 开关 1 — 取消勾选「Include Google Search Partners (搜索网络合作伙伴)」（防杂牌搜索站吃预算）。", "en": "❌ Switch 1 — Uncheck 'Include Google Search Partners' under Networks."}, {"zh": "❌ 开关 2 — 取消勾选「Include Google Display Network (展示广告网络)」（搜索广告里混入展示网盟会白烧钱）。", "en": "❌ Switch 2 — Uncheck 'Include Google Display Network' inside Search campaigns."}, {"zh": "❌ 开关 3 — 展开 Location Options (位置选项)，必须改为「Presence: People in or regularly in your targeted locations (所在地：位于或经常位于目标位置的人)」，严禁选默认的“位于目标位置或对其感兴趣的人”！", "en": "❌ Switch 3 — Under Location Options, select 'Presence: People in or regularly in your targeted locations' (never leave it on 'Presence or interest')."}, {"zh": "🛡️ 必加否定词 (Negative Keywords)：建好广告后立即添加否定词：free, cheap, diy, amazon, walmart, temu, aliexpress, manual, repair, instructions, video（拦截白嫖党与找说明书的人）。", "en": "🛡️ Add Day-1 Negative Keywords: Exclude 'free, cheap, diy, amazon, walmart, temu, aliexpress, manual, repair, video' to block non-buyers."}]}]}, {"id": "meta_setup", "badge": {"zh": "🟧 Meta 抄作业设置", "en": "🟧 Meta Setup Blueprint"}, "title": {"zh": "Meta (Facebook / Instagram) 冷启动零负担设置（ABO 测款结构、出价与通投设置）", "en": "Meta Cold-Start Setup (ABO Testing Structure, Bidding & Broad Targeting)"}, "summary": {"zh": "核心原则：用 ABO 给每个痛点测试组公平预算，用通投 (Broad) 让视频画面自己找买家。", "en": "Core rule: Use ABO so every test angle gets fair spend, and use Broad targeting so creative hooks find your buyers."}, "cards": [{"id": "meta_campaign_type", "tag": {"zh": "Campaign & 预算", "en": "Campaign & Budget"}, "tag_type": "pass", "title": {"zh": "选什么类型？✅ 选 Sales (销量) + ABO (广告组层级预算) · 🚫 测款期别开 CBO / ASC", "en": "Which Structure? ✅ Sales Objective + ABO (Ad Set Budget) · 🚫 Avoid CBO/ASC for Initial Testing"}, "bullets": [{"zh": "✅ 营销目标 (Objective)：永远选「Sales (销量)」，不要选 Traffic (流量) 或 Engagement (互动)——选流量只会买来爱乱点但不买东西的“点击党”。", "en": "✅ Campaign Objective: Always choose 'Sales' (never 'Traffic' or 'Engagement'—Traffic campaigns optimize for chronic clickers who never buy)."}, {"zh": "✅ 预算层级：关闭 Advantage+ Campaign Budget (CBO)，使用「ABO (Ad Set Budget，在广告组层级设日预算 $20–$30/组)」。每个广告组放 2–3 条同一痛点切角的视频/图文。", "en": "✅ Budget Level: Turn OFF Advantage+ Campaign Budget (CBO) and use ABO ($20–$30/day per Ad Set), placing 2–3 creatives of the same pain-point angle inside each Ad Set."}, {"zh": "🚫 为什么冷启动测款不用 CBO？CBO 会根据前 200 次曝光的表象点击率，把 85% 预算全倾斜给单一素材，导致其他潜力成单素材根本没跑够样本就被饿死！", "en": "🚫 Why not CBO during testing? CBO prematurely funnels 80%+ of spend into whichever ad gets cheap early clicks, starving other creatives before they can prove conversion."}]}, {"id": "meta_bidding", "tag": {"zh": "Bidding & 优化事件", "en": "Bidding & Event"}, "tag_type": "info", "title": {"zh": "出价与转化事件：✅ Highest Volume (最高转化量) + Purchase (购物)", "en": "Bidding & Conversion Event: ✅ Highest Volume (Lowest Cost) + Purchase"}, "bullets": [{"zh": "✅ 出价策略 (Bid Strategy)：保持默认的「Highest Volume (最高转化量)」，冷启动期切勿设置 Cost Per Result Goal (Cost Cap)，否则在 Pixel 无历史数据时广告根本花不出钱。", "en": "✅ Bid Strategy: Keep default 'Highest Volume' (Lowest Cost). Do not set a Cost Cap during Cold Start or delivery will stall completely."}, {"zh": "✅ 优化转化事件 (Conversion Event)：首选「Purchase (购物)」。注：若日预算极小 (< $40/天) 且连续 3 天 0 单，可建一个辅助组优化「Add to Cart (加购)」快速积累 50 个漏斗信号，但主力出单仍以 Purchase 为准。", "en": "✅ Conversion Event: Optimize for 'Purchase'. (If daily budget is <$40 and you have 0 sales after 3 days, you can briefly test 'Add to Cart' to warm up the pixel, then switch to 'Purchase'.)"}, {"zh": "✅ 归因窗口 (Attribution Setting)：保持标准的「7-day click or 1-day view (点击后 7 天或浏览后 1 天)」。", "en": "✅ Attribution Window: Use standard '7-day click or 1-day view'."}]}, {"id": "meta_targeting", "tag": {"zh": "🛡️ 受众与版位", "en": "🛡️ Targeting & Placements"}, "tag_type": "warn", "title": {"zh": "受众与版位设置：✅ Broad 宽泛通投（靠素材筛人）+ 关闭 Audience Network", "en": "Targeting & Placements: ✅ Broad Targeting (Let Creative Filter Buyers) + Turn OFF Audience Network"}, "bullets": [{"zh": "✅ 受众设置：选目标投放国家（如美国 US）+ 年龄 21–65+，最多只加 1 个大类词（如 Cats 或 Dogs），甚至完全不填兴趣词（Broad 通投）。不要叠加 5–6 个窄兴趣词，否则 CPM 会飙升到 $50+！", "en": "✅ Targeting: Set Country (e.g., US) + Age 21–65+ Broad (or at most 1 mega-interest like 'Cats' or 'Dogs'). Never stack narrow interests or your CPM will skyrocket."}, {"zh": "❌ 必关版位：在 Placements 中取消勾选「Audience Network」（第三方小游戏激励广告误触极多），仅保留 Facebook & Instagram 的 Feeds、Reels 和 Stories。", "en": "❌ Placements: Uncheck 'Audience Network' (high accidental clicks in mobile games). Keep Facebook & Instagram Feeds, Reels, and Stories."}]}]}], "monitor": {"inputs": {"spend": 240.0, "impressions": 10500, "views_3s": 2940, "link_clicks": 145, "add_to_carts": 9, "purchases": 3}, "cards": [{"id": "cpm", "code": "CPM", "label": {"zh": "千次曝光成本 (CPM)", "en": "CPM (Cost / 1k Impr.)"}, "value_fmt": "$22.86", "benchmark": "$12 – $28", "status": "pass", "diagnosis": {"zh": "流量曝光成本健康，受众宽度合适。", "en": "Healthy auction cost and audience size."}}, {"id": "hook_rate", "code": "Hook Rate", "label": {"zh": "3秒完播率 (Hook Rate)", "en": "3s Hook Rate"}, "value_fmt": "28.0%", "benchmark": "≥ 25.0%", "status": "pass", "diagnosis": {"zh": "黄金前 3 秒抓人能力优秀！", "en": "Strong 3-second thumbstop hook!"}}, {"id": "ctr", "code": "Outbound CTR", "label": {"zh": "链接点击率 (Link CTR)", "en": "Outbound Link CTR"}, "value_fmt": "1.38%", "benchmark": "≥ 1.20%", "status": "pass", "diagnosis": {"zh": "广告种草与点击引导非常有力。", "en": "Strong ad desire and click-through intent."}}, {"id": "cpc", "code": "CPC", "label": {"zh": "单次点击成本 (CPC)", "en": "Cost Per Click (CPC)"}, "value_fmt": "$1.66", "benchmark": "$0.70 – $1.85", "status": "pass", "diagnosis": {"zh": "进店流量成本控制良好。", "en": "Healthy visitor acquisition cost."}}, {"id": "atc_rate", "code": "ATC Rate", "label": {"zh": "落地页加购率 (ATC %)", "en": "Add-to-Cart Rate"}, "value_fmt": "6.2%", "benchmark": "≥ 5.0%", "status": "pass", "diagnosis": {"zh": "落地页首屏与价格锚点承接良好！", "en": "Landing page above-the-fold and pricing convert clicks well!"}}, {"id": "cvr", "code": "CVR", "label": {"zh": "点击购买转化率 (CVR)", "en": "Purchase CVR"}, "value_fmt": "2.07%", "benchmark": "1.8% – 3.5%", "status": "pass", "diagnosis": {"zh": "网站结账转化链路顺畅！", "en": "Strong checkout conversion rate!"}}, {"id": "cpa", "code": "Actual CPA", "label": {"zh": "实付获客成本 (CPA vs 保本线)", "en": "Actual CPA vs. Breakeven"}, "value_fmt": "$80.00 (ROAS 0.69x)", "benchmark": "≤ $35.75", "status": "fail", "diagnosis": {"zh": "实付 CPA ($80.00) 显著高于保本线 ($35.75)，请优先修复上方标红的漏斗环节。", "en": "CPA ($80.00) exceeds Breakeven ($35.75); fix the red bottleneck stage above first."}}]}, "glossary": [{"id": "m_cpm", "code": "CPM", "name": {"zh": "千次曝光成本 (Cost Per 1,000 Impressions)", "en": "CPM (Cost Per 1,000 Impressions)"}, "healthy_range": {"zh": "$12 – $28 (北美电商大盘)", "en": "$12 – $28 (US DTC Benchmark)"}, "plain_meaning": {"zh": "广告展示 1,000 次收你多少钱。代表你选的市场竞争有多激烈、以及平台觉得你的素材质量好不好。", "en": "How much the platform charges to show your ad 1,000 times. Reflects auction competition and creative quality."}, "if_abnormal": {"zh": "若 CPM > $38：说明受众圈得太窄（去掉多余兴趣词改用 Broad 通投），或视频前3秒完播率太差被系统惩罚。", "en": "If CPM > $38: Your audience is too narrow (switch to Broad targeting) or your ad engagement is too low."}}, {"id": "m_hook", "code": "Hook Rate", "name": {"zh": "3秒完播率 / 黄金前3秒截停率 (3s Views ÷ Impressions)", "en": "Hook Rate / Thumbstop Ratio (3s Views ÷ Impressions)"}, "healthy_range": {"zh": "≥ 25% (优秀 ≥ 32%)", "en": "≥ 25% (Strong ≥ 32%)"}, "plain_meaning": {"zh": "刷到你视频的人里，有多少比例停下来看了至少 3 秒。它是衡量视频开头吸引力的第一生死线。", "en": "Percentage of people scrolling the feed who stop to watch at least the first 3 seconds of your video."}, "if_abnormal": {"zh": "若 Hook Rate < 20%：无需重拍整条视频，只需把第 0–3 秒换成最具视觉冲击力的画面（如猫咪凌空扑激光点 + 大字痛点字幕）。", "en": "If Hook Rate < 20%: Keep the body of the video, but replace the first 3 seconds with a high-motion visual and bold pain-point caption."}}, {"id": "m_ctr", "code": "Outbound CTR", "name": {"zh": "链接点击率 / 出站点击率 (Link Clicks ÷ Impressions)", "en": "Outbound / Link CTR (Link Clicks ÷ Impressions)"}, "healthy_range": {"zh": "Meta ≥ 1.2% · Google Search ≥ 3.5%", "en": "Meta ≥ 1.2% · Google Search ≥ 3.5%"}, "plain_meaning": {"zh": "看完广告后真正点击链接跳往你网站的比例（注意看后台的 CTR (Link Click-Through Rate)，不要看含点赞评论的 CTR (All)）。", "en": "Percentage of impressions that clicked through to your website (always check 'CTR (Link)', not 'CTR (All)')."}, "if_abnormal": {"zh": "若 Hook Rate 高但 CTR < 0.8%：说明视频看热闹的人多，但没讲清产品卖点或结尾缺少明确行动号召（如“立享85折+免邮，点击抢购”）。", "en": "If Hook is high but CTR < 0.8%: Viewers are entertained but not sold on the product benefit or Call-to-Action (CTA)."}}, {"id": "m_cpc", "code": "CPC (Link)", "name": {"zh": "单次链接点击成本 (Spend ÷ Link Clicks)", "en": "CPC (Cost Per Link Click = Spend ÷ Link Clicks)"}, "healthy_range": {"zh": "$0.70 – $1.80", "en": "$0.70 – $1.80"}, "plain_meaning": {"zh": "每买一个真实访客进店花多少钱（公式上等于 CPM ÷ (1000 × CTR)）。", "en": "How much you pay for each visitor landing on your store (mathematically equals CPM ÷ (1000 × CTR))."}, "if_abnormal": {"zh": "若 CPC > $2.50：进店流量太贵！要么通过提高视频 CTR 把点击成本打下来，要么在 Google 中调低 Max CPC 上限。", "en": "If CPC > $2.50: Traffic is too expensive. Improve ad CTR or lower your Max CPC cap in Google Search."}}, {"id": "m_atc", "code": "ATC Rate", "name": {"zh": "落地页加购率 (Add to Carts ÷ Link Clicks)", "en": "ATC Rate (Add to Carts ÷ Link Clicks)"}, "healthy_range": {"zh": "≥ 5.0% (优秀 ≥ 8.0%)", "en": "≥ 5.0% (Strong ≥ 8.0%)"}, "plain_meaning": {"zh": "点进网站的人里有多少比例点了 Add to Cart。这是检验「落地页首屏、价格、评价」是否接得住广告流量的核心指标！", "en": "Percentage of ad clicks that add the product to cart. Directly measures whether your landing page fulfills the ad's promise."}, "if_abnormal": {"zh": "若 CTR ≥ 1.2% 但加购率 < 3.5%：千万别关这条好广告！问题出在网站：检查手机加载速度、首屏利益点标题、实拍评价以及是否有大体积 GIF 卡死。", "en": "If CTR ≥ 1.2% but ATC < 3.5%: Do NOT kill the ad! Fix your landing page above-the-fold headline, price anchor, reviews, or page speed."}}, {"id": "m_cvr", "code": "CVR", "name": {"zh": "点击购买转化率 (Purchases ÷ Link Clicks)", "en": "CVR (Conversion Rate = Purchases ÷ Link Clicks)"}, "healthy_range": {"zh": "1.8% – 3.5%", "en": "1.8% – 3.5%"}, "plain_meaning": {"zh": "每 100 个广告点击最终能成交几单。独立站中高客单价通常在 1.5%–3.5% 之间。", "en": "Out of 100 ad clicks, how many complete payment. Typical DTC e-commerce ranges from 1.5% to 3.5%."}, "if_abnormal": {"zh": "若加购率高 (≥ 6%) 但转化率 < 1.0%：说明客户在结账最后一步跑了！重点排查隐藏高额运费、不支持快捷支付 (Apple Pay/PayPal) 或折扣码失效。", "en": "If ATC ≥ 6% but CVR < 1.0%: Shoppers are abandoning at checkout. Check for surprise shipping fees, missing Apple Pay/PayPal, or broken promo codes."}}, {"id": "m_cpa", "code": "CPA", "name": {"zh": "单次获客/成单成本 (Spend ÷ Purchases)", "en": "CPA (Cost Per Acquisition = Spend ÷ Purchases)"}, "healthy_range": {"zh": "必须 ≤ 保本 CPA (AOV × 毛利率)", "en": "Must be ≤ Breakeven CPA (AOV × Gross Margin)"}, "plain_meaning": {"zh": "平均花多少广告费才能拿下一笔订单。只要 CPA 小于你的每单毛利（保本 CPA），这笔广告就在净赚现金。", "en": "Ad spend required to generate 1 order. Whenever CPA is below your gross profit per order (Breakeven CPA), you are profitable."}, "if_abnormal": {"zh": "若 CPA > 保本 CPA：可通过模块一公式拆解：要么优化素材降低 CPC，要么优化落地页提升 CVR，要么加 2x/3x 阶梯捆绑提高客单价 AOV。", "en": "If CPA > Breakeven CPA: Either lower CPC (better creative), raise CVR (better landing page), or raise AOV with 2x/3x quantity bundles."}}, {"id": "m_roas_mer", "code": "ROAS vs MER", "name": {"zh": "广告支出回报率 (ROAS) 与 全店真实盈亏比 (Blended MER)", "en": "Platform ROAS vs. Store-Wide Blended MER"}, "healthy_range": {"zh": "必须 ≥ 保本 ROAS (1 ÷ 毛利率)", "en": "Must be ≥ Breakeven ROAS (1 ÷ Gross Margin)"}, "plain_meaning": {"zh": "ROAS 是每花 $1 广告带来多少销售额；而 MER = Shopify 全店总净销售额 ÷ 所有平台总广告费。平台后台自报的 ROAS 往往有水分，真实赚钱看 MER！", "en": "ROAS is revenue per $1 of ad spend. Blended MER = Total Shopify Net Sales ÷ Total Ad Spend across all channels (the ultimate CFO truth)."}, "if_abnormal": {"zh": "当冷启动跑满 14–30 天后，切勿只信广告后台虚高的自归因 ROAS，请进入 Step 2 (BudgetPilot) 用边际 mROAS 调仓。", "en": "Once you exit Cold Start (14–30 days), stop relying on inflated platform ROAS and move to Step 2 (BudgetPilot) for marginal mROAS allocation."}}], "graduation": {"passed_count": 0, "total_count": 4, "progress_pct": 0.0, "ready_for_step2": false, "items": [{"id": "grad_days", "title": {"zh": "1. 累计连续投放满 14–30 天（覆盖完整工作日与周末转化周期）", "en": "1. Completed 14–30 days of continuous delivery (capturing weekday & weekend cycles)"}, "detail": {"zh": "拥有足够的时间序列样本，使 Step 2 (BudgetPilot) 的几何 Adstock 滞后效应与 Hill 饱和曲线能够稳定拟合。", "en": "Provides enough daily time-series points for Step 2 BudgetPilot's geometric Adstock and Hill saturation curves."}, "checked": false}, {"id": "grad_orders", "title": {"zh": "2. Shopify 独立站累计真实成交   let currentLang = "zh";
  try {
    if (window.__SNAPSHOT_STATE__ && window.__SNAPSHOT_STATE__.lang) {
      currentLang = window.__SNAPSHOT_STATE__.lang;
    } else {
      currentLang =
        localStorage.getItem("bp-lang") ||
        ((navigator.language || "").toLowerCase().startsWith("en") ? "en" : "zh");
    }
  } catch (e) {}

  const listeners = [];

  const SHELL_T = {
    en: {

      exporting: "Exporting...",
      snapMode: "Static Snapshot (Read-Only Link)",
      liveMode: "Live OS",

    zh: {
      exportSnap: "导出静态快照 (.html)",

      liveMode: "实时系统",

  function getLang() {
    return currentLang;
  }

  function setLang(newLang) {
    if (newLang !== "en" && newLang !== "zh") return;
    currentLang = newLang;
    try {
      localStorage.setItem("bp-lang", currentLang);
    } catch (e) {}
    document.documentElement.lang = currentLang === "zh" ? "zh-CN" : "en";
    listeners.forEach((fn) => fn(currentLang));

  function onLangChange(fn) {
    listeners.push(fn);

  function L(obj) {
    if (!obj) return "";
    if (typeof obj === "string") return obj;
    return obj[currentLang] ?? obj.en ?? obj.zh ?? "";

  function shellT(key) {
    return (SHELL_T[currentLang] && SHELL_T[currentLang][key]) || SHELL_T.en[key] || key;
  }

  const esc = (s) =>
    String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  const usd = (v, d = 0) =>
    (v < 0 ? "−" : "") +
    "$" +
    Math.abs(Number(v || 0)).toLocaleString("en-US", {
      minimumFractionDigits: d,
      maximumFractionDigits: d,
    });

  const sUsd = (v) =>
    (v >= 0 ? "+" : "−") + "$" + Math.abs(Math.round(Number(v || 0))).toLocaleString("en-US");

  const pct = (v, d = 0) => (Number(v || 0) * 100).toFixed(d) + "%";
  const sPct = (v) => (v >= 0 ? "+" : "−") + Math.abs(Number(v || 0) * 100).toFixed(0) + "%";
  const xx = (v) => Number(v || 0).toFixed(2) + "x";
  const kfmt = (v) =>
    Math.abs(v) >= 1000

  function showTip(html, e) {
    const tip = document.getElementById("tip");
    if (!tip) return;
    tip.innerHTML = html;
    tip.hidden = false;
    const w = tip.offsetWidth;
    const h = tip.offsetHeight;
    let x = e.clientX + 14;
    let y = e.clientY + 14;
    if (x + w > window.innerWidth - 8) x = e.clientX - w - 14;
    if (y + h > window.innerHeight - 8) y = e.clientY - h - 14;
    tip.style.left = Math.max(8, x) + "px";
    tip.style.top = Math.max(8, y) + "px";
  }

  function hideTip() {
    const tip = document.getElementById("tip");
    if (tip) tip.hidden = true;
  }

    `<div class="tr"><span>${color ? `<i class="sw" style="background:${color}"></i>` : ""}${esc(label)}</span><b>${val}</b></div>`;

  window.BPCore = {
    getLang,
    setLang,
    onLangChange,
    L,
    shellT,
    esc,
    $,
    $$,
    usd,
    sUsd,
    pct,
    sPct,
    xx,
    kfmt,
    showTip,
    hideTip,
    trow,
  };
})();

/**

 * Adding a new tab in the future only requires calling:
 *   window.TabRegistry.register({
 *     id: "my_tab",

 *     setState(data) { ... }
 *   });

(function () {
  const tabs = new Map();
  let activeTabId = null;

  function register(tabDef) {
    if (!tabDef || !tabDef.id) {
      throw new Error("Tab definition requires a unique 'id'");
    }
    tabs.set(tabDef.id, tabDef);
    if (!activeTabId) {
      activeTabId = tabDef.id;
    }
  }

  function getTabs() {
    return Array.from(tabs.values());
  }

  function getActiveTabId() {
    return activeTabId;
  }

  function renderTabBar() {
    const nav = document.getElementById("tab-nav");
    if (!nav) return;
    const { L, esc } = window.BPCore;
    nav.innerHTML = getTabs()
      .map((t) => {
        const isSelected = t.id === activeTabId;
        const stepBadge = t.step ? `<span class="step-tag">${esc(t.step)}</span>` : "";
        return `<button type="button" role="tab" class="tab-btn" data-tab-id="${esc(t.id)}" aria-selected="${isSelected}">${stepBadge}<span>${esc(L(t.label))}</span></button>`;
      })
      .join("");

    nav.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        switchTab(btn.dataset.tabId);
      });
    });
  }

  async function switchTab(tabId, updateHash = true) {
    if (!tabs.has(tabId)) return;
    window.BPCore.hideTip();
    activeTabId = tabId;
    if (updateHash) {
      try {
        history.replaceState(null, "", `#${tabId}`);
      } catch (e) {}
    }
    renderTabBar();
    const container = document.getElementById("app");
    if (!container) return;
    const tab = tabs.get(tabId);
    await tab.mount(container);
  }

  async function rerenderActive() {
    renderTabBar();
    const container = document.getElementById("app");
    if (!container || !activeTabId || !tabs.has(activeTabId)) return;
    await tabs.get(activeTabId).mount(container);
  }

  function collectAllStates() {
    const out = {};
    for (const [id, tab] of tabs.entries()) {
      if (typeof tab.getState === "function") {
        out[id] = tab.getState();
      }
    }
    return out;
  }

  function restoreAllStates(snapshotTabs) {
    if (!snapshotTabs) return;
    for (const [id, tab] of tabs.entries()) {
      if (snapshotTabs[id] && typeof tab.setState === "function") {
        tab.setState(snapshotTabs[id]);
      }
    }
  }

  window.TabRegistry = {
    register,
    getTabs,
    getActiveTabId,
    renderTabBar,
    switchTab,
    rerenderActive,
    collectAllStates,
    restoreAllStates,
  };
})();

/**
 * Client-side Snapshot Exporter for BudgetPilot Agency OS.
 * Exports a single standalone .html file containing all tabs, styles, scripts,
 * and current tab states (Step 0 Health Check + Step 1 BudgetPilot) for sharing.
 */
(function () {
  function triggerDownload(htmlContent, filename) {
    const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 200);
  }

  async function exportStaticSnapshot() {
    const btn = document.getElementById("btn-snapshot");
    const { getLang, shellT } = window.BPCore;
    if (btn) {
      btn.disabled = true;
      btn.textContent = shellT("exporting");
    }

    const payload = {
      active_tab: window.TabRegistry.getActiveTabId(),
      lang: getLang(),
      tabs: window.TabRegistry.collectAllStates(),
    };

    const dateStr = new Date().toISOString().slice(0, 10);
    const filename = `BudgetPilot_Snapshot_${dateStr}.html`;

    try {
      if (!window.__SNAPSHOT_STATE__) {
        const res = await fetch("/api/snapshot", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),

          const html = await res.text();
          triggerDownload(html, filename);

      const existingStateScript = clone.querySelector("#__snapshot_state__");

        existingStateScript.textContent = `window.__SNAPSHOT_STATE__ = ${stateJson};`;

        const sc = document.createElement("script");
        sc.id = "__snapshot_state__";
        sc.textContent = `window.__SNAPSHOT_STATE__ = ${stateJson};`;

      if (btn) {

  let state = null;

  let scanProgress = { pct: 0, stepIdx: 0, etaSec: 6 };

  const t = (k) => {
    const lang = window.BPCore.getLang();
    return (HC_T[lang] && HC_T[lang][k]) || HC_T.en[k] || k;
  };

  function recalculateClientSide() {
    if (!state || !state.categories) return;
    let autoEarned = 0;
    let manualEarned = 0;
    let recPendingCount = 0;
    let autoRecFails = 0;

    for (const cat of state.categories) {
      let catEarned = 0;
      for (const item of cat.items) {
        const w = Number(item.weight || 0);
        if (item.mode === "auto") {
          const autoSt = item.auto_status || item.status || "pending";
          item.auto_status = autoSt;
          const autoPts =
            item.auto_points !== undefined
              ? Number(item.auto_points)
              : autoSt === "pass"
              ? w
              : autoSt === "warn"
              ? +(w * 0.5).toFixed(1)
              : 0;
          item.auto_points = autoPts;

          if (item.manual_override && autoSt !== "pass") {
            item.status = "pass";
            item.earned_points = w;
            autoEarned += autoPts;
            manualEarned += +(w - autoPts).toFixed(1);
          } else {
            item.status = autoSt;
            item.earned_points = autoPts;
            autoEarned += autoPts;
          }
          catEarned += item.earned_points;
          if (item.status !== "pass" && item.critical) {
            recPendingCount++;
            if (item.status === "fail") autoRecFails++;
          }
        } else {
          const checked = Boolean(item.checked);
          const pts = checked ? w : 0;
          item.earned_points = pts;
          item.status = checked ? "pass" : "pending";
          manualEarned += pts;
          catEarned += pts;
          if (!checked && item.critical) {
            recPendingCount++;
          }
        }
      }
      cat.earned_points = +catEarned.toFixed(1);
    }

    const autoScore = +autoEarned.toFixed(1);
    const manualScore = +manualEarned.toFixed(1);
    const totalScore = +(autoScore + manualScore).toFixed(1);

    let verdict = "BLOCKED";
    let verdictLabel = {
      zh: "🛑 暂不建议投流 — 多项强烈建议项尚未通过，现在投广告极易造成预算流失",
      en: "🛑 Not Ready for Ad Spend — Multiple strongly recommended checks are not yet passing",
    };

    if (!state.url && totalScore === 0) {
      verdict = "PENDING";
      verdictLabel = {
        zh: "👋 请在上方输入您的店铺网址并点击「开始自动验证」，或直接点击下方条目核对",
        en: "👋 Enter your store URL above and click 'Auto-Scan Website', or mark checklist items below",
      };
    } else if (totalScore >= 85 && recPendingCount === 0) {
      verdict = "READY";
      verdictLabel = {
        zh: "✅ 网站已就绪 (Ready to Launch Ads) — 可安全开启投放与进入 Step 1 预算分配",
        en: "✅ Store is Ad-Ready — Safe to launch campaigns and proceed to Step 1 BudgetPilot",
      };
    } else if (totalScore >= 60 && autoRecFails === 0) {
      verdict = "CAUTION";
      verdictLabel = {
        zh: "⚠️ 基本可用但存在漏损风险 — 强烈建议先完成下方未通过项再放量",
        en: "⚠️ Launch with Caution — Strongly recommended to complete unpassed items below before scaling",
      };
    }

    state.scores = {
      ...state.scores,
      total_score: totalScore,
      auto_verified_score: autoScore,
      manual_reported_score: manualScore,
      verdict,
      verdict_label: verdictLabel,
      critical_blockers_count: recPendingCount,
    };
  }

  function getManualChecksMap() {
    const map = {};
    if (!state || !state.categories) return map;
    for (const cat of state.categories) {
      for (const item of cat.items) {
        if (item.mode === "manual") {
          map[item.id] = Boolean(item.checked);
        } else if (item.manual_override) {
          map[item.id] = true;
        }
      }
    }
    return map;
  }

  async function fetchApiWithFallback(path, options) {
    // 1. Try relative URL first (when served from FastAPI http://127.0.0.1:8000)
    if (window.location.protocol.startsWith("http")) {
      const res = await fetch(path, options);
      if (res.ok) return await res.json();
    }
    // 2. If opened via file:// (standalone snapshot), try local FastAPI server on port 8000
    try {
      const resLocal = await fetch(`http://127.0.0.1:8000${path}`, options);
      if (resLocal.ok) return await resLocal.json();
    } catch (e) {}
    return null;
  }

  function buildOfflineSimulatedScan(targetUrl) {
    // Fallback when user opens the standalone HTML file without running the Python backend server
    let normalized = targetUrl.trim();
    if (!normalized.startsWith("http://") && !normalized.startsWith("https://")) {
      normalized = "https://" + normalized;
    }
    const isHttpOnly = normalized.startsWith("http://");
    const clone = JSON.parse(JSON.stringify(state));
    clone.url = normalized;

    const simResults = {
      trst_https_ssl: isHttpOnly
        ? {
            status: "fail",
            ptsRatio: 0,
            ev: {
              zh: `当前网址使用不安全的 http:// 协议 (${normalized})，未启用 HTTPS。`,
              en: `URL uses insecure http:// (${normalized}) instead of HTTPS.`,
            },
          }
        : {
            status: "pass",
            ptsRatio: 1,
            ev: {
              zh: `HTTPS 加密协议检测正常 (${normalized})。`,
              en: `HTTPS scheme verified (${normalized}).`,
            },
          },
      trk_utm_persistence: {
        status: "pass",
        ptsRatio: 1,
        ev: {
          zh: `测试参数 ?utm_source=test&fbclid=test123&ttclid=test456&gclid=test789 在目标 URL 上保留正常。`,
          en: `Tracking parameters (?utm_source=test&fbclid=test123&ttclid=test456&gclid=test789) preserved on target URL.`,
        },
      },
      trk_pixels_present: {
        status: "warn",
        ptsRatio: 0.5,
        ev: {
          zh: `离线快照模拟检测：建议启动本地 FastAPI 后端或使用 Pixel Helper 确认 ${normalized} 上的 Meta/TikTok/Google 像素代码。`,
          en: `Offline snapshot probe: run with FastAPI backend or Pixel Helper to verify Meta/TikTok/Google tags on ${normalized}.`,
        },
      },
      mob_heavy_gif: {
        status: "pass",
        ptsRatio: 1,
        ev: {
          zh: `未在 URL 路径中检测到超过 5MB 的重型 .gif 资源。`,
          en: `No oversized >5MB .gif assets detected on URL path.`,
        },
      },
      trst_legal_pages: {
        status: "warn",
        ptsRatio: 0.5,
        ev: {
          zh: `请确认 ${normalized} 页脚包含 Privacy、Terms、Refund、Shipping 四项完整政策链接。`,
          en: `Confirm ${normalized} footer links Privacy, Terms, Refund, and Shipping policies.`,
        },
      },
      trst_contact_page: {
        status: "warn",
        ptsRatio: 0.5,
        ev: {
          zh: `请确认 Contact Us 页面同时包含品牌域名邮箱 (support@...)、联系表单及真实地址/电话。`,
          en: `Confirm Contact Us page includes branded support email, form, and physical address/phone.`,
        },
      },
      trst_no_placeholders: {
        status: "pass",
        ptsRatio: 1,
        ev: {
          zh: `未检测到 Lorem ipsum 或默认失效社媒链接。`,
          en: `No 'Lorem ipsum' or broken default social links detected.`,
        },
      },
      trst_favicon: {
        status: "pass",
        ptsRatio: 1,
        ev: {
          zh: `站点图标路径 /favicon.ico 检查完成。`,
          en: `Site favicon check completed.`,
        },
      },
      trst_dns_email: {
        status: "warn",
        ptsRatio: 0.5,
        ev: {
          zh: `请核实域名 DNS TXT 记录已配置 v=spf1 与 _dmarc (v=DMARC1)。`,
          en: `Verify domain DNS TXT records include v=spf1 and _dmarc (v=DMARC1).`,
        },
      },
    };

    for (const cat of clone.categories || []) {
      for (const item of cat.items || []) {
        if (item.mode === "auto" && simResults[item.id]) {
          const r = simResults[item.id];
          item.auto_status = r.status;
          item.auto_points = +(item.weight * r.ptsRatio).toFixed(1);
          item.evidence = r.ev;
          item.manual_override = false;
        }
      }
    }
    state = clone;
    recalculateClientSide();
  }

  async function loadPreset(presetName) {
    activePreset = presetName;
    const data = await fetchApiWithFallback(`/api/healthcheck/demo/${presetName}`);
    if (data) {
      state = data;
    } else if (state) {
      // Offline snapshot fallback for presets
      if (presetName === "empty") {
        state.url = "";
        state.categories.forEach((c) =>
          c.items.forEach((i) => {
            if (i.mode === "auto") {
              i.auto_status = "pending";
              i.auto_points = 0;
              i.manual_override = false;
            } else {
              i.checked = false;
            }
          })
        );
      } else if (presetName === "ready") {
        state.url = "https://kibblewise-pet.com/products/360-interactive-laser-toy";
        state.categories.forEach((c) =>
          c.items.forEach((i) => {
            if (i.mode === "auto") {
              i.auto_status = "pass";
              i.auto_points = i.weight;
              i.manual_override = false;
            } else {
              i.checked = i.id !== "aov_cross_sell" && i.id !== "ret_welcome_flow";
            }
          })
        );
      } else if (presetName === "unready") {
        state.url = "https://kibblewise-pet.com/products/360-interactive-laser-toy";
        const failIds = new Set(["trk_utm_persistence", "mob_heavy_gif", "trst_no_placeholders", "trst_favicon"]);
        const warnIds = new Set(["trk_pixels_present", "trst_legal_pages", "trst_contact_page", "trst_dns_email"]);
        state.categories.forEach((c) =>
          c.items.forEach((i) => {
            if (i.mode === "auto") {
              i.manual_override = false;
              if (failIds.has(i.id)) {
                i.auto_status = "fail";
                i.auto_points = 0;
              } else if (warnIds.has(i.id)) {
                i.auto_status = "warn";
                i.auto_points = +(i.weight * 0.5).toFixed(1);
              } else {
                i.auto_status = "pass";
                i.auto_points = i.weight;
              }
            } else {
              i.checked = ["chk_shipping_zones", "chk_guest_checkout", "cro_above_fold", "cro_visual_gallery", "ret_welcome_flow", "ret_order_confirmation"].includes(i.id);
            }
          })
        );
      }
      recalculateClientSide();
    }
    const container = document.getElementById("app");
    if (container && window.TabRegistry.getActiveTabId() === "healthcheck") {
      render(container);
    }
  }

  function updateProgressDom(container) {
    const fill = container.querySelector("#hc-prog-fill");
    const stepEl = container.querySelector("#hc-prog-step");
    const etaEl = container.querySelector("#hc-prog-eta");
    const steps = t("scanSteps");
    if (fill) fill.style.width = `${scanProgress.pct}%`;
    if (stepEl) stepEl.textContent = steps[Math.min(steps.length - 1, scanProgress.stepIdx)];
    if (etaEl) etaEl.textContent = t("etaFmt")(scanProgress.etaSec);
  }

  async function runLiveScan(urlInput, singleItemId = null) {
    const cleanUrl = (urlInput || (state && state.url) || "").trim();
    if (!cleanUrl) {
      const inp = document.getElementById("hc-url-input");
      if (inp) inp.focus();
      return;
    }

    const container = document.getElementById("app");
    if (singleItemId) {
      retestingItemId = singleItemId;
    } else {
      isScanning = true;
      scanProgress = { pct: 12, stepIdx: 0, etaSec: 6 };
    }
    activePreset = "";
    if (container) render(container);

    let timer = null;
    if (!singleItemId) {
      timer = setInterval(() => {
        if (scanProgress.pct < 92) {
          scanProgress.pct = Math.min(92, scanProgress.pct + 18);
          scanProgress.stepIdx = Math.min(4, Math.floor(scanProgress.pct / 20));
          scanProgress.etaSec = Math.max(1, 6 - scanProgress.stepIdx);
          if (container) updateProgressDom(container);
        }
      }, 650);
    }

    const minWait = new Promise((r) => setTimeout(r, singleItemId ? 600 : 2400));

    try {
      const manualMap = getManualChecksMap();
      if (singleItemId) {
        delete manualMap[singleItemId];
      }

      const [apiData] = await Promise.all([
        fetchApiWithFallback("/api/healthcheck/scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            url: cleanUrl,
            manual_checks: manualMap,
          }),
        }),
        minWait,
      ]);

      if (apiData) {
        if (singleItemId && state && state.categories) {
          // Update only the re-tested item while preserving other items
          for (let ci = 0; ci < state.categories.length; ci++) {
            for (let ii = 0; ii < state.categories[ci].items.length; ii++) {
              const oldItem = state.categories[ci].items[ii];
              if (oldItem.id === singleItemId) {
                const freshItem = apiData.categories[ci].items[ii];
                freshItem.manual_override = false;
                state.categories[ci].items[ii] = freshItem;
                if (freshItem.status !== "pass") {
                  expandedItems.add(singleItemId);
                }
              }
            }
          }
          state.url = apiData.url;
          recalculateClientSide();
        } else {
          state = apiData;
          recalculateClientSide();
        }
      } else {
        buildOfflineSimulatedScan(cleanUrl);
      }
    } finally {
      if (timer) clearInterval(timer);
      isScanning = false;
      retestingItemId = null;
      if (container && window.TabRegistry.getActiveTabId() === "healthcheck") {
        render(container);
      }
    }
  }

  function getStatusPillHtml(item) {
    const { esc } = window.BPCore;
    const isAuto = item.mode === "auto";

    }
    if (st === "warn") {

    }
    if (st === "fail") {
      return `<span class="hc-status-pill fail">${esc(t("pillFail"))}</span>`;
    }

  function renderCategories() {
    const { L, esc } = window.BPCore;
    const allItemIds = (state.categories || []).flatMap((c) => c.items.map((i) => i.id));

    const catHtml = (state.categories || [])
      .map((cat) => {
        const itemsHtml = cat.items
          .map((item) => {
            const isAuto = item.mode === "auto";
            const status = item.status || (item.checked ? "pass" : "pending");
            const isExpanded = expandedItems.has(item.id);
            const isRetesting = retestingItemId === item.id;

            const statusPill = getStatusPillHtml(item);
            const modeBadge = isAuto
              ? `<span class="hc-badge-mode auto">${esc(t("badgeAuto"))}</span>`
              : `<span class="hc-badge-mode manual">${esc(t("badgeManual"))}</span>`;
            const recBadge = item.critical ? `<span class="hc-badge-rec">${esc(t("badgeRec"))}</span>` : "";

            let actionsHtml = "";
            if (isAuto) {
              const isMarked = Boolean(item.manual_override || item.status === "pass");
              actionsHtml = `
                <button type="button" class="hc-mini-btn hc-btn-retest" data-item-id="${esc(item.id)}" ${
                isRetesting ? "disabled" : ""
              }>${esc(isRetesting ? t("btnRetesting") : t("btnRetest"))}</button>

                  item.manual_override ? "done-active" : ""
                }" data-item-id="${esc(item.id)}">${esc(
                isMarked && item.manual_override ? t("btnMarkedDone") : t("btnMarkDone")
              )}</button>
              `;
            } else {
              actionsHtml = `
                <button type="button" class="hc-mini-btn hc-btn-mark-manual ${
                  item.checked ? "done-active" : ""
                }" data-item-id="${esc(item.id)}">${esc(
                item.checked ? t("btnMarkedDone") : t("btnMarkDone")
              )}</button>
              `;
            }

            const ptsClass =
              item.earned_points >= item.weight
                ? "earned"
                : item.earned_points > 0
                ? "partial"
                : "zero";

            const bullets = (item.bullets || []).map((b) => `<li>${esc(L(b))}</li>`).join("");

            let diagHtml = "";
            if (isAuto && item.evidence) {
              diagHtml = `<div class="hc-evidence ${esc(status)}"><b>${esc(t("scannerEvidence"))}</b> ${esc(
                L(item.evidence)
              )}</div>`;
            } else if (!isAuto && item.hint && item.hint.text) {
              diagHtml = `<div class="hc-evidence"><b>${esc(t("autoHintLbl"))}</b> ${esc(L(item.hint.text))}</div>`;
            }

            const fixHtml =
              status !== "pass"
                ? `<div class="hc-fix-box"><b>${esc(t("howToFix"))}</b> ${esc(L(item.how_to_improve))}</div>`
                : "";

            return `<div class="hc-item status-${esc(status)} ${isExpanded ? "expanded" : ""}" data-row-id="${esc(
              item.id
            )}">
              <div class="hc-item-header" data-toggle-id="${esc(item.id)}">
                <div class="hc-item-left">
                  <span class="hc-chevron" aria-hidden="true">▸</span>
                  ${statusPill}
                  <span class="hc-item-title">${esc(L(item.title))}</span>
                  ${modeBadge}

                </div>
                <div class="hc-item-right">

      </div>

  function bindEvents(container) {
    const form = container.querySelector("#hc-scan-form");
    if (form) {
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const inp = container.querySelector("#hc-url-input");
        if (inp) runLiveScan(inp.value);
      });
    }

    container.querySelectorAll(".hc-preset-btn[data-preset]").forEach((btn) => {
      btn.addEventListener("click", () => {
        loadPreset(btn.dataset.preset);
      });
    });

    const btnCheckAll = container.querySelector("#hc-check-all");
    if (btnCheckAll) {
      btnCheckAll.addEventListener("click", () => {
        if (!state || !state.categories) return;
        state.categories.forEach((c) =>
          c.items.forEach((i) => {
            if (i.mode === "manual") i.checked = true;
          })
        );
        recalculateClientSide();
        render(container);
      });
    }

    const btnReset = container.querySelector("#hc-reset-all");
    if (btnReset) {
      btnReset.addEventListener("click", () => {
        loadPreset("empty");
      });
    }

    const btnGotoBp = container.querySelector("#hc-goto-bp");
    if (btnGotoBp) {
      btnGotoBp.addEventListener("click", () => {
        window.TabRegistry.switchTab("coldstart");
      });
    }

    const btnToggleExpandAll = container.querySelector("#hc-toggle-expand-all");
    if (btnToggleExpandAll) {
      btnToggleExpandAll.addEventListener("click", () => {
        const allIds = (state.categories || []).flatMap((c) => c.items.map((i) => i.id));

        if (allExpanded) {
          expandedItems.clear();
        } else {
          allIds.forEach((id) => expandedItems.add(id));
        }
        render(container);
      });
    }

    // Toggle collapse/expand when clicking item header (unless clicking an action button)
    container.querySelectorAll(".hc-item-header[data-toggle-id]").forEach((hdr) => {
      hdr.addEventListener("click", (e) => {
        if (e.target.closest("button")) return;
        const iid = hdr.dataset.toggleId;
        const rowEl = container.querySelector(`.hc-item[data-row-id="${iid}"]`);
        if (expandedItems.has(iid)) {
          expandedItems.delete(iid);
          if (rowEl) rowEl.classList.remove("expanded");
        } else {
          expandedItems.add(iid);
          if (rowEl) rowEl.classList.add("expanded");
        }
      });
    });

    // Re-test button on Auto-Verified items
    container.querySelectorAll(".hc-btn-retest").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const iid = btn.dataset.itemId;
        const inp = container.querySelector("#hc-url-input");
        const urlVal = (inp && inp.value.trim()) || (state && state.url) || "";
        if (!urlVal) {
          if (inp) inp.focus();
          return;
        }
        runLiveScan(urlVal, iid);
      });
    });

    // Mark Done override button on Auto-Verified items
    container.querySelectorAll(".hc-btn-mark-auto").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const iid = btn.dataset.itemId;
        for (const cat of state.categories || []) {
          for (const item of cat.items || []) {
            if (item.id === iid) {
              item.manual_override = !item.manual_override;
            }
          }
        }
        recalculateClientSide();
        render(container);
      });
    });

    // Mark Done toggle button on Manual items
    container.querySelectorAll(".hc-btn-mark-manual").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const iid = btn.dataset.itemId;
        for (const cat of state.categories || []) {
          for (const item of cat.items || []) {
            if (item.id === iid) {
              item.checked = !item.checked;
            }
          }
        }
        recalculateClientSide();
        render(container);
      });
    });
  }

  function render(container) {
    if (!state) {
      container.innerHTML = `<p style="margin-top:32px">Loading Health Check...</p>`;
      return;
    }
    container.innerHTML = renderScannerBar() + renderScoreSummary() + renderCategories();
    bindEvents(container);
  }

  async function mount(container) {
    if (!state) {
      if (
        window.__SNAPSHOT_STATE__ &&
        window.__SNAPSHOT_STATE__.tabs &&
        window.__SNAPSHOT_STATE__.tabs.healthcheck
      ) {
        state = window.__SNAPSHOT_STATE__.tabs.healthcheck;
        recalculateClientSide();
      } else {
        await loadPreset("empty");
        return;
      }
    }
    render(container);
  }

  window.TabRegistry.register({
    id: "healthcheck",
    step: "Step 0",
    label: {
      zh: "投前网站体检 (Health Check)",
      en: "Ads Health Check",
    },
    mount,
    getState() {
      return state;
    },
    setState(newData) {
      state = newData;
    },
  });
})();

          zh: `实付 CPA ($${cpa.toFixed(2)}) 低于保本线 ($${breakevenCpa.toFixed(2)})，单单净赚毛利！`,
          en: `Actual CPA ($${cpa.toFixed(2)}) beats Breakeven ($${breakevenCpa.toFixed(2)})—profitable!`,
        },
        warn: {
          zh: `实付 CPA ($${cpa.toFixed(2)}) 略高于保本线 ($${breakevenCpa.toFixed(2)})，可加 2x 捆绑提客单价。`,
          en: `CPA ($${cpa.toFixed(2)}) slightly above Breakeven ($${breakevenCpa.toFixed(2)}); add 2x bundles.`,
        },
        fail: {

          en: `CPA ($${cpa.toFixed(2)}) exceeds Breakeven ($${breakevenCpa.toFixed(2)}); fix red stages first.`,
        },
      }[cpaSt];
    } else {
      cpaSt = spend < breakevenCpa * 1.5 ? "warn" : "fail";
      cpaFmt = `0 单 ($${spend.toFixed(0)})`;
      cpaDiag =
        cpaSt === "warn"
          ? {
              zh: `当前 0 单，花费 ($${spend.toFixed(0)}) 未到止损线 ($${(breakevenCpa * 1.5).toFixed(0)})，继续观察。`,
